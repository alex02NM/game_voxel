  // ============ INPUT / CONTROLS ============
  const LOOK_SENS = 0.0025;
  const PITCH_MIN = -1.45;
  const PITCH_MAX =  1.45;

  const keys = Object.create(null);

  const SWALLOW = {
    Space: 1, ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1,
    KeyW: 1, KeyA: 1, KeyS: 1, KeyD: 1
  };

  window.addEventListener('keydown', e => {
    if (e.repeat) { if (SWALLOW[e.code]) e.preventDefault(); return; }
    keys[e.code] = true;
    if (SWALLOW[e.code]) e.preventDefault();
  }, { passive: false });

  window.addEventListener('keyup', e => {
    keys[e.code] = false;
    if (SWALLOW[e.code]) e.preventDefault();
  }, { passive: false });

  function releaseAllKeys() { for (const k in keys) keys[k] = false; }
  window.addEventListener('blur',  releaseAllKeys);
  window.addEventListener('pagehide', releaseAllKeys);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) releaseAllKeys();
  });

  let dragging = false;
  let lastX = 0, lastY = 0;
  let dragDistance = 0;

  function applyLook(dx, dy) {
    player.yaw   += dx * LOOK_SENS;
    player.pitch -= dy * LOOK_SENS;
    if (player.pitch < PITCH_MIN) player.pitch = PITCH_MIN;
    if (player.pitch > PITCH_MAX) player.pitch = PITCH_MAX;
    if (player.yaw >  Math.PI * 2 || player.yaw < -Math.PI * 2) {
      player.yaw = player.yaw % (Math.PI * 2);
    }
  }

  const pointerLockSupported =
    'pointerLockElement' in document || 'mozPointerLockElement' in document;

  canvas.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    dragging = true;
    dragDistance = 0;
    lastX = e.clientX;
    lastY = e.clientY;
  });

  window.addEventListener('mouseup', e => {
    if (e.button !== 0) return;
    dragging = false;
  });

  window.addEventListener('mousemove', e => {
    const locked = pointerLockSupported &&
                   document.pointerLockElement === canvas;

    if (locked) {
      applyLook(e.movementX || 0, e.movementY || 0);
      return;
    }

    if (!dragging) return;

    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    dragDistance += Math.abs(dx) + Math.abs(dy);
    applyLook(dx, dy);
  });

  canvas.addEventListener('click', () => {
    if (!pointerLockSupported) return;
    if (document.pointerLockElement === canvas) return;
    if (dragDistance > 6) return;
    const p = canvas.requestPointerLock();
    if (p && typeof p.catch === 'function') p.catch(() => {});
  });

  document.addEventListener('pointerlockerror', () => {});

  let touchId = null, touchX = 0, touchY = 0;
  canvas.addEventListener('touchstart', e => {
    if (touchId !== null) return;
    const t = e.changedTouches[0];
    touchId = t.identifier; touchX = t.clientX; touchY = t.clientY;
  }, { passive: true });
  canvas.addEventListener('touchmove', e => {
    if (touchId === null) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier !== touchId) continue;
      applyLook(t.clientX - touchX, t.clientY - touchY);
      touchX = t.clientX; touchY = t.clientY;
    }
  }, { passive: true });
  function endTouch(e) {
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === touchId) touchId = null;
    }
  }
  canvas.addEventListener('touchend',    endTouch, { passive: true });
  canvas.addEventListener('touchcancel', endTouch, { passive: true });

  // ============ AUDIO ============
  const audioEl = document.getElementById('backroomsMusic');
  let audioUnlocked = false;
  function unlockAudio() {
    initHum();
    if (audioUnlocked || !audioEl) return;
    audioUnlocked = true;
    const p = audioEl.play();
    if (p && typeof p.catch === 'function') p.catch(() => {});
  }
  window.addEventListener('pointerdown', unlockAudio);
  window.addEventListener('keydown',     unlockAudio);
  window.addEventListener('touchstart',  unlockAudio, { passive: true });
  if (audioEl) {
    const p = audioEl.play();
    if (p && typeof p.catch === 'function') p.catch(() => {});
  }

  // ============ ENTITY WHISPER AUDIO ============
  const whisperEl = document.getElementById('ghostWhisper');
  const WHISPER = {
    NEAR_DIST:   48,
    FAR_VOL:     0.0,
    MAX_VOL:     0.85,
    MIN_GAP:     2.5,
    MAX_GAP:     8.5,
    UNLOCK_VOL:  0.001
  };

  const whisperState = {
    nextPlayAt: performance.now() / 1000 + 2.0,
    playing:    false,
    baseVol:    0.0,
    lastDistance: Infinity
  };

  if (whisperEl) {
    whisperEl.volume = 0.0;
    whisperEl.addEventListener('error', () => {
      console.warn('ghostWhisper audio failed to load:', whisperEl.src);
    });
  }

  function playWhisperBurst(nowSec) {
    if (!whisperEl) return;
    try {
      const dur = isFinite(whisperEl.duration) && whisperEl.duration > 0
        ? whisperEl.duration
        : 4.0;
      whisperEl.currentTime = Math.random() * Math.max(0.0, dur - 0.6);
      whisperEl.playbackRate = 0.82 + Math.random() * 0.36;
    } catch (e) { /* ignore */ }

    const p = whisperEl.play();
    if (p && typeof p.catch === 'function') p.catch(() => {});
    whisperState.playing = true;
    whisperState.nextPlayAt =
      nowSec + WHISPER.MIN_GAP + Math.random() * (WHISPER.MAX_GAP - WHISPER.MIN_GAP);
  }

  function updateWhisper(dt, nowSec) {
    if (!whisperEl) return;

    const active = entity.houseIdx >= 0 && entity.p > 0.05;
    let dist = Infinity;
    if (active) {
      const dx = entity.world[0] - player.pos[0];
      const dy = entity.world[1] - player.pos[1];
      const dz = entity.world[2] - player.pos[2];
      dist = Math.hypot(dx, dy, dz);
    }
    whisperState.lastDistance = dist;

    const inRange = dist < WHISPER.NEAR_DIST;

    if (!inRange) {
      if (whisperState.playing) {
        const v = whisperEl.volume;
        if (v > 0.01) {
          whisperEl.volume = Math.max(0, v - dt * 1.5);
        } else {
          whisperEl.volume = 0;
          try { whisperEl.pause(); } catch (e) {}
          whisperState.playing = false;
        }
      }
      if (nowSec >= whisperState.nextPlayAt) {
        whisperState.nextPlayAt =
          nowSec + WHISPER.MIN_GAP + Math.random() * (WHISPER.MAX_GAP - WHISPER.MIN_GAP);
      }
      return;
    }

    const t = 1.0 - dist / WHISPER.NEAR_DIST;
    const targetVol = WHISPER.FAR_VOL + t * (WHISPER.MAX_VOL - WHISPER.FAR_VOL);
    whisperState.baseVol = targetVol;

    if (nowSec >= whisperState.nextPlayAt) {
      playWhisperBurst(nowSec);
    }

    if (whisperState.playing) {
      const v = whisperEl.volume;
      whisperEl.volume = v + (targetVol - v) * Math.min(1, dt * 3.0);
    }
  }

  function stopWhisper() {
    if (!whisperEl) return;
    try { whisperEl.pause(); } catch (e) {}
    whisperEl.volume = 0;
    whisperState.playing = false;
  }
    // ============ GLITCH STATE ============
  const glitch = {
    level:    0.0,   // 0..1, overall visual chaos
    warp:     0.35,  // tape-warp amount
    dread:    0.0,   // 0..1, rises when the entity is close
    nextBurst: 3.0,
    burstDur:  0.0
  };

  function updateGlitch(dt) {
    // schedule the next hard glitch burst
    glitch.nextBurst -= dt;
    if (glitch.nextBurst <= 0) {
      glitch.nextBurst = 2.5 + Math.random() * 9.0;
      glitch.burstDur  = 0.15 + Math.random() * 0.9;
    }

    // baseline drift, plus bursts
    let target = 0.03 + 0.02 * Math.sin(performance.now() * 0.0004);
    if (glitch.burstDur > 0) {
      glitch.burstDur -= dt;
      target = 0.55 + Math.random() * 0.55;
    }

    // dread ramps in when the entity is within ~60m
    const d = whisperState.lastDistance;
    let dread = 0;
    if (isFinite(d)) dread = Math.max(0, 1 - d / 60);
    glitch.dread += (dread - glitch.dread) * Math.min(1, dt * 2.0);

    target = Math.max(target, glitch.dread * 0.85);
    glitch.level += (target - glitch.level) * Math.min(1, dt * 6.0);
    glitch.warp  += ((0.35 + glitch.dread * 1.2) - glitch.warp) * Math.min(1, dt * 1.5);
  }

  // ============ FLUORESCENT HUM ============
  let humCtx = null, humGain = null;
  let humOsc1 = null, humOsc2 = null, humNoise = null;
  let humStarted = false;
  let humTarget  = 0.055;

  function initHum() {
    if (humStarted) return;
    humStarted = true;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      humCtx  = new AC();
      humGain = humCtx.createGain();
      humGain.gain.value = 0.0;
      humGain.connect(humCtx.destination);

      // 60Hz mains-ish saw
      humOsc1 = humCtx.createOscillator();
      humOsc1.type = 'sawtooth';
      humOsc1.frequency.value = 60;
      const g1 = humCtx.createGain();
      g1.gain.value = 0.55;
      humOsc1.connect(g1).connect(humGain);

      // thin ballast whine
      humOsc2 = humCtx.createOscillator();
      humOsc2.type = 'square';
      humOsc2.frequency.value = 118;
      const g2 = humCtx.createGain();
      g2.gain.value = 0.035;
      humOsc2.connect(g2).connect(humGain);

      // filtered room tone
      const len = humCtx.sampleRate * 2;
      const buf = humCtx.createBuffer(1, len, humCtx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * 0.15;
      humNoise = humCtx.createBufferSource();
      humNoise.buffer = buf;
      humNoise.loop = true;
      const lp = humCtx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 420;
      const g3 = humCtx.createGain();
      g3.gain.value = 0.55;
      humNoise.connect(lp).connect(g3).connect(humGain);

      humOsc1.start();
      humOsc2.start();
      humNoise.start();
    } catch (e) {
      console.warn('Hum init failed', e);
    }
  }

  function updateHum(dt) {
    if (!humCtx || !humGain) return;
    const base   = 0.055;
    const target = base + glitch.dread * 0.18 + glitch.level * 0.04;
    humTarget += (target - humTarget) * Math.min(1, dt * 1.5);

    const now   = performance.now();
    const flick = 0.92 + 0.08 * Math.sin(now * 0.011)
                       + 0.03 * Math.sin(now * 0.037);
    humGain.gain.value = humTarget * flick;

    if (humCtx.state === 'suspended') humCtx.resume().catch(() => {});
  }

  // ============ FPS ============
  const infoEl = document.getElementById('info');
  let frames = 0, fpsTimer = performance.now();

  // ============ PALETTE ============
  // everything is the same colour as a dying fluorescent tube
  const SUN_COLOR     = [1.00, 0.90, 0.58];
  const SKY_COLOR     = [0.34, 0.29, 0.11];
  const HORIZON_COLOR = [0.74, 0.66, 0.31];
  const GROUND_COLOR  = [0.18, 0.15, 0.06];

  const terrainVAO = gl.createVertexArray();

  // ============ MAIN LOOP ============
  let lastTime = performance.now();
  const startTime = performance.now();
  const WALK_SPEED   = 28;
  const SPRINT_SPEED = 90;

  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;
    const time = (now - startTime) / 1000;

    const sprint = !!(keys['ShiftLeft'] || keys['ShiftRight']);
    const speed  = sprint ? SPRINT_SPEED : WALK_SPEED;

    let f = 0, r = 0;
    if (keys['KeyW'] || keys['ArrowUp'])    f += 1;
    if (keys['KeyS'] || keys['ArrowDown'])  f -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) r += 1;
    if (keys['KeyA'] || keys['ArrowLeft'])  r -= 1;

    if (f !== 0 || r !== 0) {
      const inv = 1 / Math.hypot(f, r);
      f *= inv; r *= inv;

      const sy = Math.sin(player.yaw);
      const cy = Math.cos(player.yaw);
      const fwdX =  sy, fwdZ = -cy;
      const rgtX =  cy, rgtZ =  sy;

      player.target[0] += (fwdX * f + rgtX * r) * speed * dt;
      player.target[2] += (fwdZ * f + rgtZ * r) * speed * dt;
    }

    const groundY = terrainHeightJS(player.target[0], player.target[2]) + player.eye;
    player.target[1] += (groundY - player.target[1]) * Math.min(1, dt * 12);

    player.pos[0] = player.target[0];
    player.pos[2] = player.target[2];
    player.pos[1] = player.target[1];

    const cp = Math.cos(player.pitch);
    const fwdX = player.pos[0] + Math.sin(player.yaw) * cp;
    const fwdY = player.pos[1] + Math.sin(player.pitch);
    const fwdZ = player.pos[2] - Math.cos(player.yaw) * cp;
    mat4.lookAt(viewMatrix, player.pos, [fwdX, fwdY, fwdZ], [0, 1, 0]);

    // ---- the body you are wearing breathes and never quite settles
    const moving  = (f !== 0 || r !== 0) ? 1.0 : 0.0;
    const bobY    = Math.sin(time * 1.85) * 0.050 + Math.sin(time * 0.71) * 0.030;
    const bobX    = Math.sin(time * 1.13 + 1.7) * 0.045;
    const swayR   = Math.sin(time * 0.97) * 0.030;
    const stepB   = Math.sin(time * 9.4) * 0.030 * moving;
    const jitterX = (Math.random() - 0.5) * 0.035 * glitch.level;

    mat4.translate(viewMatrix, viewMatrix, [bobX + jitterX, bobY + stepB, 0.0]);
    mat4.rotateZ(viewMatrix, viewMatrix, swayR + glitch.level * (Math.random() - 0.5) * 0.10);

    mat4.copy(modelViewMatrix, viewMatrix);

    // focal length drifts so nothing ever looks the same twice
    const fov = Math.PI / 4 * (1.0 + Math.sin(time * 0.41) * 0.030)
              + glitch.level * Math.sin(time * 24.0) * 0.05;
    mat4.perspective(projectionMatrix, fov, canvas.width / canvas.height, 0.1, 250000);

    updateLightMatrices();
    updateEntity(dt);

    // the air hums, the tape warps, the whisper comes and goes
    updateWhisper(dt, time);
    updateGlitch(dt);
    updateHum(dt);

    mat4.multiply(viewProj, projectionMatrix, viewMatrix);
    extractFrustum(viewProj);
    gatherHouses();

    // ========== SHADOW PASS ==========
    gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFBO);
    gl.viewport(0, 0, SHADOW_SIZE, SHADOW_SIZE);
    gl.clearColor(1, 1, 1, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.disable(gl.CULL_FACE);

    gl.useProgram(shadowProg);
    gl.uniformMatrix4fv(shadowU.lightViewProj, false, lightViewProj);
    gl.uniform1f(shadowU.k, TERRAIN.k);
    gl.uniform1f(shadowU.p, TERRAIN.p);
    gl.uniform1f(shadowU.m, TERRAIN.m);
    gl.uniform1i(shadowU.seed, TERRAIN.seed);
    gl.uniform2f(shadowU.cameraPos, player.pos[0], player.pos[2]);
    gl.uniform1f(shadowU.cellSize, TERRAIN.cellSize);
    gl.uniform1i(shadowU.gridSize, TERRAIN.gridSize);
    gl.bindVertexArray(terrainVAO);
    gl.drawArrays(gl.TRIANGLES, 0, VERTEX_COUNT);

    drawHousesShadow();

    // ========== SKY + MAIN PASS ==========
    gl.bindFramebuffer(gl.FRAMEBUFFER, msaaSamples > 0 ? msaaFBO : sceneFBO);
    gl.viewport(0, 0, sceneW, sceneH);
    gl.clearColor(HORIZON_COLOR[0], HORIZON_COLOR[1], HORIZON_COLOR[2], 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    mat4.invert(invViewProj, viewProj);
    gl.disable(gl.DEPTH_TEST);
    gl.depthMask(false);
    gl.useProgram(skyProg);
    gl.uniformMatrix4fv(skyU.invViewProj, false, invViewProj);
    gl.uniform3fv(skyU.cameraWorld, player.pos);
    gl.uniform3fv(skyU.sunDir, sunDir);
    gl.uniform3fv(skyU.sunColor, SUN_COLOR);
    gl.uniform3fv(skyU.skyColor, SKY_COLOR);
    gl.uniform3fv(skyU.horizonColor, HORIZON_COLOR);
    gl.uniform1f(skyU.time, time);
    gl.bindVertexArray(terrainVAO);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.depthMask(true);
    gl.enable(gl.DEPTH_TEST);

    gl.disable(gl.CULL_FACE);
    gl.useProgram(mainProg);
    gl.uniformMatrix4fv(mainU.modelViewMatrix,  false, modelViewMatrix);
    gl.uniformMatrix4fv(mainU.projectionMatrix, false, projectionMatrix);
    gl.uniformMatrix4fv(mainU.lightViewProj,    false, lightViewProj);
    gl.uniform1f(mainU.k, TERRAIN.k);
    gl.uniform1f(mainU.p, TERRAIN.p);
    gl.uniform1f(mainU.m, TERRAIN.m);
    gl.uniform1i(mainU.seed, TERRAIN.seed);
    gl.uniform2f(mainU.cameraPos, player.pos[0], player.pos[2]);
    gl.uniform1f(mainU.cellSize, TERRAIN.cellSize);
    gl.uniform1i(mainU.gridSize, TERRAIN.gridSize);
    gl.uniform3fv(mainU.sunDir, sunDir);
    gl.uniform3fv(mainU.sunColor, SUN_COLOR);
    gl.uniform3fv(mainU.skyColor, SKY_COLOR);
    gl.uniform3fv(mainU.groundColor, GROUND_COLOR);
    gl.uniform3fv(mainU.horizonColor, HORIZON_COLOR);
    gl.uniform3fv(mainU.cameraWorld, player.pos);
    gl.uniform1f(mainU.shadowRadius, 1.0);
    gl.uniform1i(mainU.shadowEnabled, 1);
    gl.uniform1f(mainU.grassBump, 0.004);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, grassTex);
    gl.uniform1i(mainU.texture, 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, shadowTex);
    gl.uniform1i(mainU.shadowMap, 1);

    gl.bindVertexArray(terrainVAO);
    gl.drawArrays(gl.TRIANGLES, 0, VERTEX_COUNT);

    drawHousesMain();
    drawEntity();

    if (msaaSamples > 0) {
      gl.bindFramebuffer(gl.READ_FRAMEBUFFER, msaaFBO);
      gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, sceneFBO);
      gl.blitFramebuffer(0, 0, sceneW, sceneH, 0, 0, sceneW, sceneH,
                         gl.COLOR_BUFFER_BIT, gl.NEAREST);
    }

    // ========== CRT POST PASS ==========
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.CULL_FACE);
    gl.depthMask(false);

    gl.useProgram(postProg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, sceneColorTex);
    gl.uniform1i(postU.scene, 0);

    gl.uniform2f(postU.resolution, canvas.width, canvas.height);
    gl.uniform1f(postU.time, time);
    gl.uniform1f(postU.curvature,  CRT.curvature);
    gl.uniform1f(postU.blur,       Math.min(1.5 * currentDpr, CRT.blur));
    gl.uniform1f(postU.scanline,   CRT.scanline);
    gl.uniform1f(postU.aberration, CRT.aberration);
    gl.uniform1f(postU.noise,      CRT.noise);
    gl.uniform1f(postU.vignette,   CRT.vignette);
    gl.uniform1f(postU.flicker,    CRT.flicker);
    gl.uniform1f(postU.mask,       CRT.mask);
    gl.uniform1f(postU.glitch,     glitch.level);
    gl.uniform1f(postU.warp,       glitch.warp);
    gl.uniform1f(postU.dread,      glitch.dread);

    gl.bindVertexArray(terrainVAO);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.depthMask(true);
    gl.enable(gl.DEPTH_TEST);

    frames++;
    if (now - fpsTimer >= 500) {
      const fps = (frames * 1000) / (now - fpsTimer);
      const wd = whisperState.lastDistance;
      const wdStr = isFinite(wd) ? wd.toFixed(1) : '--';
      infoEl.textContent =
        'FPS: ' + fps.toFixed(1) + '   Houses: ' + houseInstances.length +
        '  Forms: ' + entityForms.length + '   GLITCH: ' + glitch.level.toFixed(2) + '\n' +
        'WASD / Arrows: move   Shift: sprint\n' +
        'Click: mouse-look (Esc to release)   Drag: look\n' +
        'R: reset view   Entity dist: ' + wdStr;
      frames = 0;
      fpsTimer = now;
    }
  }

  window.addEventListener('keydown', e => {
    if (e.code !== 'KeyR') return;
    player.yaw = 0;
    player.pitch = -0.05;
    player.target[0] = 0; player.target[2] = 78;
    player.target[1] = terrainHeightJS(0, 78) + player.eye;
    player.pos[0] = player.target[0];
    player.pos[1] = player.target[1];
    player.pos[2] = player.target[2];
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopWhisper();
  });

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
