<!DOCTYPE html>
<html lang="en">
<head>

<title>WebGL2 Terrain — Voxel Rainforest</title>
<style>
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;background:#000;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;font:14px monospace}

canvas{display:block;width:100vw;height:100dvh;touch-action:none;-webkit-tap-highlight-color:transparent}

.hud{position:fixed;left:8px;z-index:10;color:#0f0}
#fps{top:8px}#mode{top:26px;color:#0ff}#biome{top:44px;color:#ff0}#net{top:62px;color:#f80}
#status{position:fixed;right:8px;top:8px;z-index:10;color:#0af;font-size:12px;text-align:right}

  bottom:max(18px,env(safe-area-inset-bottom,0px) + 18px);width:156px;height:156px;border-radius:50%;
  background:radial-gradient(circle,rgba(70,200,160,.10),rgba(20,55,48,.30) 62%,rgba(8,16,15,.48));
  border:2px solid rgba(130,240,190,.35);

  border:1px dashed rgba(140,255,200,.18)}

  background:radial-gradient(circle at 35% 30%,rgba(120,200,255,.35),rgba(28,55,85,.72));

    <input type="range" id="tree_d" min="0" max="3" step="0.05" value="1.6"></label>
  <button id="rainforest-btn">🌴 Rainforest Preset</button>

  <button id="respawn-btn">🏠 Respawn (0, 0)</button>

  <label>🎵 Music Volume <span class="val" id="music_vol_val">50%</span>
    <input type="range" id="music_vol" min="0" max="100" step="1" value="25"></label>
  <button id="music-btn">🔊 Ambient Music: OFF</button>
  <button id="fs-btn">⛶ Fullscreen: OFF</button>
  <button id="touch-btn">🎮 Touch Controls: OFF</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"></script>
<script>
/* ════════════════════════════════════════════════════════════
   1 · CONTEXT
   ════════════════════════════════════════════════════════════ */
const canvas = document.getElementById('webgl-canvas');
canvas.width  = innerWidth;
canvas.height = innerHeight;
const gl = canvas.getContext('webgl2', {antialias:true, depth:true});
if (!gl) throw new Error('WebGL2 unavailable');

/* ════════════════════════════════════════════════════════════
   2 · STATE
   ════════════════════════════════════════════════════════════ */
let mouseX = 0, mouseY = 0;
let targetPosition = [100, 40, 2];
let position       = [0, 10, 10];
const keysPressed  = {};
const modelViewMatrix = mat4.create();
const joyVec = {x:0, y:0};
let lookTouchId = null, sprinting = false;
let velocityY = 13, grounded = true, flightMode = false;
const GRAVITY = -30, EYE_HEIGHT = 2, JUMP_SPEED = 12;

const MAX_EDITS = 32, edits = [];
const MODE_NAMES = ['SMOOTH','VOXEL','MINECRAFT BLOCKS'];
let modeIndex = 0, blockSize = 1;

const SUN_DIR    = [.45, .85, .30];
const SUN_COLOR  = [1.05, 1.00, .90];
const EXPOSURE   = 1.00;
let   shadowsEnabled = true;
let   treesEnabled   = true;

let TREE_HEIGHT_MULT  = 1.5;
let TREE_DENSITY_MULT = 1.6;

const BIOMES = [
  {name:'PLAINS', sky:[.58,.76,.97], top:[.20,.42,.86], ground:[.34,.40,.22],
   zombie:.22, animal:.78, tree:.12, conifer:.25},
  {name:'FOREST', sky:[.42,.60,.60], top:[.13,.28,.34], ground:[.18,.26,.15],
   zombie:.45, animal:.55, tree:.75, conifer:.55},
  {name:'DESERT', sky:[.98,.85,.62], top:[.30,.52,.86], ground:[.55,.46,.28],
   zombie:.35, animal:.65, tree:.05, conifer:.10},
  {name:'SNOW',   sky:[.85,.90,.99], top:[.40,.58,.90], ground:[.52,.56,.64],
   zombie:.30, animal:.70, tree:.18, conifer:.85},
];
let currentSky      = [.58,.76,.97];
let currentSkyTop   = [.20,.42,.86];
let currentGround   = [.34,.40,.22];
let currentBiomeName = 'PLAINS';
const FOG_DENSITY = .0012;
const TERRAIN = {k:10, p:10, m:10, seed:1.36};

/* ════════════════════════════════════════════════════════════
   3 · SHADERS
   ════════════════════════════════════════════════════════════ */
const COMMON_GLSL = `
uniform vec3  u_sunDir, u_sunColor, u_skyTop, u_skyHorizon, u_groundColor;
uniform float u_exposure;
vec3 aces(vec3 x) {
    const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;
    return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
}
vec3 toSRGB(vec3 c) { return pow(max(c, 0.0), vec3(1.0 / 2.2)); }
vec3 skyColor(vec3 dir) {
    vec3 d = normalize(dir);
    float h  = d.y;
    float sd = max(dot(d, normalize(u_sunDir)), 0.0);
    float t  = clamp(h * 1.4 + 0.06, 0.0, 1.0);
    vec3 sky = mix(u_skyHorizon, u_skyTop, pow(t, 0.62));
    sky = mix(u_skyHorizon * 0.72, sky, smoothstep(-0.16, 0.05, h));
    sky += u_sunColor * pow(sd, 12.0) * 0.30;
    sky += u_sunColor * smoothstep(0.9985, 0.9996, sd) * 10.0;
    return sky;
}
vec3 hemiAmbient(vec3 N) {
    return mix(u_groundColor, u_skyTop, clamp(N.y * 0.5 + 0.5, 0.0, 1.0));
}
`;

const terrainGLSL = `
uniform vec4 u_edits[32];
uniform int  u_editCount;
uniform float u_blocky, u_blockSize, u_mode;
float f(float x, float s, float k, float p) {
    float val = 45731.0 * cos(1e5 * floor(x) + s);
    return (k * mod(val, 2.0)) / p;
}
float g(float a, float b, float c, float d, float x) {
    return -0.5 * (b - d) * cos(3.1415926 * (x - c) / (a - c)) + 0.5 * (b + d);
}
float h(float x, float s, float k, float p) {
    return g(floor(x), f(x, s, k, p), floor(x) + 1.0, f(x + 1.0, s, k, p), x);
}
float i(float x, float y, float s, float k, float p) {
    float a = floor(x);
    float b = h(y, a + 45731.0 * s, k, p);
    float c = a + 1.0;
    float d = h(y, floor(x + 1.0) + 45731.0 * s, k, p);
    return g(a, b, c, d, x);
}
float voxel_round(float v) { return floor(v / u_blockSize + 0.5) * u_blockSize; }
float terrain_height_raw(vec2 pos, float k, float p, float m, float s) {
    vec2 scaled = pos / m;
    float height = k * i(scaled.x, scaled.y, s, k, p);
    for (int n = 0; n < 32; n++) {
        if (n >= u_editCount) break;
        vec4 e = u_edits[n];
        height += e.w * (1.0 - smoothstep(0.0, e.z, length(pos - e.xy)));
    }
    return height;
}
float terrain_height(vec2 pos, float k, float p, float m, float s) {
    bool isBlocky = u_blocky > 0.5;
    vec2 samplePos = isBlocky ? (floor(pos / u_blockSize) + 0.5) * u_blockSize : pos;
    float height = terrain_height_raw(samplePos, k, p, m, s);
    if (isBlocky) height = voxel_round(height);
    return height;
}
float block_height(vec2 centre, float k, float p, float m, float s) {
    return voxel_round(terrain_height_raw(centre, k, p, m, s));
}
float terrain_height_mode(vec2 pos, float k, float p, float m, float s) {
    if (u_mode > 1.5) {
        vec2 c = (floor(pos / u_blockSize) + 0.5) * u_blockSize;
        return block_height(c, k, p, m, s);
    }
    return terrain_height(pos, k, p, m, s);
}
`;

const biomeGLSL = `
float bnoise(vec2 p) {
    return sin(p.x * 0.0125) * cos(p.y * 0.0107)
         + 0.5  * sin(p.x * 0.0310 + 1.7) * cos(p.y * 0.0265 - 0.9)
         + 0.25 * sin(p.x * 0.0710 + 4.1) * cos(p.y * 0.0663 + 2.2);
}
vec3 biome_tint(vec2 p, float y) {
    float t = bnoise(p + vec2(1234.5, 567.8));
    float m = bnoise(p * 1.3 + vec2(-987.6, 321.4));
    vec3 cPlains = vec3(0.55, 0.80, 0.42);
    vec3 cForest = vec3(0.30, 0.60, 0.30);
    vec3 cDesert = vec3(0.94, 0.85, 0.56);
    vec3 cSnow   = vec3(0.95, 0.97, 1.00);
    vec3 cRock   = vec3(0.56, 0.57, 0.59);
    float snow   = 1.0 - smoothstep(-0.45, -0.05, t);
    float desert = smoothstep(0.10, 0.50, t) * (1.0 - smoothstep(-0.25, 0.10, m));
    float forest = smoothstep(0.05, 0.45, m);
    float plains = 1.0;
    float sum = snow + desert + forest + plains;
    vec3 c = (cPlains * plains + cForest * forest + cDesert * desert + cSnow * snow) / sum;
    c = mix(c, cRock, smoothstep(12.0, 18.0, y) * (1.0 - snow));
    c = mix(c, cSnow, smoothstep(17.0, 20.5, y));
    return c;
}
`;

const VS_TERRAIN = `#version 300 es
precision highp float;
uniform mat4 u_modelViewMatrix, u_projectionMatrix;
uniform float u_k, u_p, u_m, u_S_seed;
uniform vec2  u_cameraPos;
uniform float u_gridSize;
uniform float u_baseCell;
uniform int   u_level;
out highp vec2 v_uv;
out highp vec3 v_worldPos, v_normal;
${terrainGLSL}
const int VERTS_PER_COLUMN = 30;
const int CLIP_N = 128;
void main() {
    if (u_mode > 1.5) {
        int gridSize = int(u_gridSize);
        int columnID = gl_VertexID / VERTS_PER_COLUMN;
        int localID  = gl_VertexID % VERTS_PER_COLUMN;
        int cx = columnID / gridSize;
        int cz = columnID % gridSize;
        float B = u_blockSize * exp2(float(u_level));
        float H = 0.5 * B;
        vec2 camBlock = u_cameraPos / B;
        vec2 origin = floor(camBlock) - vec2(float(gridSize) * 0.5);
        if (u_level > 0) {
            int hc = gridSize / 2;
            int hr = gridSize / 4 - 1;
            if (cx >= hc - hr && cx < hc + hr && cz >= hc - hr && cz < hc + hr) {
                gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
                v_uv = vec2(0.0); v_worldPos = vec3(0.0); v_normal = vec3(0.0, 1.0, 0.0);
                return;
            }
        }
        vec2 bp = origin + vec2(float(cx), float(cz));
        vec2 c  = (bp + 0.5) * B;
        float hSelf = block_height(c, u_k, u_p, u_m, u_S_seed);
        float texScale = B * 2.0;
        vec3 pos; vec2 uv; vec3 nrm;
        if (localID < 6) {
            vec2 o;
            if (localID == 0) o = vec2(-H,-H);
            else if (localID == 1) o = vec2(H,-H);
            else if (localID == 2) o = vec2(H,H);
            else if (localID == 3) o = vec2(-H,-H);
            else if (localID == 4) o = vec2(H,H);
            else o = vec2(-H,H);
            pos = vec3(c.x + o.x, hSelf, c.y + o.y);
            uv  = vec2(pos.x, pos.z) / texScale;
            nrm = vec3(0.0, 1.0, 0.0);
        } else {
            int faceID = (localID - 6) / 6;
            int vid    = (localID - 6) - faceID * 6;
            vec2 nOff;
            if (faceID == 0) nOff = vec2(B,0);
            else if (faceID == 1) nOff = vec2(-B,0);
            else if (faceID == 2) nOff = vec2(0,B);
            else nOff = vec2(0,-B);
            float hN = block_height(c + nOff, u_k, u_p, u_m, u_S_seed);
            float y0 = hN, y1 = hSelf;
            vec3 BL, BR, TR, TL;
            if (faceID == 0) { BL = vec3(c.x+H,y0,c.y+H); BR = vec3(c.x+H,y0,c.y-H); TR = vec3(c.x+H,y1,c.y-H); TL = vec3(c.x+H,y1,c.y+H); }
            else if (faceID == 1) { BL = vec3(c.x-H,y0,c.y-H); BR = vec3(c.x-H,y0,c.y+H); TR = vec3(c.x-H,y1,c.y+H); TL = vec3(c.x-H,y1,c.y-H); }
            else if (faceID == 2) { BL = vec3(c.x-H,y0,c.y+H); BR = vec3(c.x+H,y0,c.y+H); TR = vec3(c.x+H,y1,c.y+H); TL = vec3(c.x-H,y1,c.y+H); }
            else { BL = vec3(c.x+H,y0,c.y-H); BR = vec3(c.x-H,y0,c.y-H); TR = vec3(c.x-H,y1,c.y-H); TL = vec3(c.x+H,y1,c.y-H); }
            vec3 v;
            if (vid == 0) v = BL; else if (vid == 1) v = TL; else if (vid == 2) v = TR;
            else if (vid == 3) v = BL; else if (vid == 4) v = TR; else v = BR;
            if (hN >= hSelf - 0.001) v = vec3(c.x, hSelf, c.y);
            pos = v;
            if (faceID == 0) nrm = vec3(1,0,0);
            else if (faceID == 1) nrm = vec3(-1,0,0);
            else if (faceID == 2) nrm = vec3(0,0,1);
            else nrm = vec3(0,0,-1);
            if (faceID == 0 || faceID == 1) uv = vec2(pos.z, pos.y) / texScale;
            else uv = vec2(pos.x, pos.y) / texScale;
        }
        v_uv = uv; v_worldPos = pos; v_normal = nrm;
        gl_Position = u_projectionMatrix * u_modelViewMatrix * vec4(pos, 1.0);
        return;
    }
    int quadID = gl_VertexID / 6;
    int vid    = gl_VertexID % 6;
    int ix = quadID % CLIP_N;
    int iz = quadID / CLIP_N;
    float cell  = u_baseCell * exp2(float(u_level));
    float halfN = float(CLIP_N) * 0.5;
    vec2 center = floor(u_cameraPos / cell) * cell;
    vec2 origin = center - vec2(halfN) * cell;
    if (u_level > 0) {
        int hc = CLIP_N / 2;
        int hr = CLIP_N / 4 - 2;
        if (ix >= hc - hr && ix < hc + hr && iz >= hc - hr && iz < hc + hr) {
            gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
            v_uv = vec2(0.0); v_worldPos = vec3(0.0); v_normal = vec3(0.0, 1.0, 0.0);
            return;
        }
    }
    vec2 o;
    if      (vid == 0) o = vec2(0.0, 0.0);
    else if (vid == 1) o = vec2(1.0, 0.0);
    else if (vid == 2) o = vec2(1.0, 1.0);
    else if (vid == 3) o = vec2(0.0, 0.0);
    else if (vid == 4) o = vec2(1.0, 1.0);
    else               o = vec2(0.0, 1.0);
    vec2 worldPos = origin + (vec2(float(ix), float(iz)) + o) * cell;
    float height = terrain_height(worldPos, u_k, u_p, u_m, u_S_seed);
    vec3 pos = vec3(worldPos.x, height, worldPos.y);
    float eps = max(cell, 0.5);
    float hL = terrain_height(worldPos - vec2(eps, 0.0), u_k, u_p, u_m, u_S_seed);
    float hR = terrain_height(worldPos + vec2(eps, 0.0), u_k, u_p, u_m, u_S_seed);
    float hD = terrain_height(worldPos - vec2(0.0, eps), u_k, u_p, u_m, u_S_seed);
    float hU = terrain_height(worldPos + vec2(0.0, eps), u_k, u_p, u_m, u_S_seed);
    v_normal = normalize(vec3(hL - hR, 2.0 * eps, hD - hU));
    v_uv = worldPos / 1.1;
    v_worldPos = pos;
    gl_Position = u_projectionMatrix * u_modelViewMatrix * vec4(pos, 1.0);
}
`;

const FS_TERRAIN = `#version 300 es
precision highp float;
precision highp int;
in highp vec2 v_uv;
in highp vec3 v_worldPos, v_normal;
uniform sampler2D u_texture;
uniform vec3  u_cameraPosition;
uniform float u_fogDensity;
uniform float u_shadows;
uniform float u_k, u_p, u_m, u_S_seed;
out vec4 outColor;
${terrainGLSL}
${biomeGLSL}
${COMMON_GLSL}
float terrainShadow(vec3 p, vec3 L) {
    if (u_shadows < 0.5) return 1.0;
    float t    = 2.0 + fract(sin(dot(p.xz, vec2(12.9898, 78.233))) * 43758.5453) * 2.5;
    float step = 2.0;
    for (int i = 0; i < 10; i++) {
        vec3 sp = p + L * t;
        float h = terrain_height_mode(sp.xz, u_k, u_p, u_m, u_S_seed);
        if (sp.y < h - 0.06) return 0.0;
        t    += step;
        step *= 1.45;
    }
    return 1.0;
}
void main() {
    vec3 texel  = texture(u_texture, v_uv).rgb;
    vec3 albedo = pow(max(texel, 0.0), vec3(2.2));
    albedo *= pow(biome_tint(v_worldPos.xz, v_worldPos.y), vec3(2.2));
    vec3 N = normalize(v_normal);
    vec3 L = normalize(u_sunDir);
    vec3 V = normalize(u_cameraPosition - v_worldPos);
    vec3 Hv = normalize(L + V);
    float dist   = length(v_worldPos - u_cameraPosition);
    float shadow = (dist < 300.0) ? terrainShadow(v_worldPos + N * 0.4, L) : 1.0;
    float ndl  = dot(N, L);
    float diff = clamp((ndl + 0.12) / 1.12, 0.0, 1.0) * shadow;
    vec3 ambient = hemiAmbient(N);
    vec3 color   = albedo * (ambient * 0.55 + u_sunColor * diff * 1.15);
    float spec = pow(max(dot(N, Hv), 0.0), 42.0) * 0.10 * shadow;
    color += u_sunColor * spec;
    float fog = clamp(1.0 - exp(-dist * u_fogDensity), 0.0, 1.0);
    color = mix(color, skyColor(-V), fog);
    outColor = vec4(toSRGB(aces(color * u_exposure)), 1.0);
}
`;

const VS_PROBE = `#version 300 es
precision highp float;
uniform vec2 u_probeOrigin;
uniform float u_probeCell;
uniform int u_probeN;
uniform float u_k, u_p, u_m, u_S_seed;
out float v_height;
${terrainGLSL}
void main() {
    int n = u_probeN;
    int id = gl_VertexID;
    int ix = id % n;
    int iz = id / n;
    vec2 wp = u_probeOrigin + vec2(float(ix), float(iz)) * u_probeCell;
    v_height = terrain_height_mode(wp, u_k, u_p, u_m, u_S_seed);
    float fx = (float(ix) + 0.5) / float(n);
    float fz = (float(iz) + 0.5) / float(n);
    gl_Position = vec4(fx * 2.0 - 1.0, fz * 2.0 - 1.0, 0.0, 1.0);
    gl_PointSize = 1.0;
}
`;
const FS_PROBE = `#version 300 es
precision highp float;
in float v_height;
out vec4 outColor;
void main() { outColor = vec4(v_height, 0.0, 0.0, 1.0); }
`;

const VS_SKY = `#version 300 es
precision highp float;
out vec2 v_ndc;
void main() {
    vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
    v_ndc = p * 2.0 - 1.0;
    gl_Position = vec4(v_ndc, 1.0, 1.0);
}
`;
const FS_SKY = `#version 300 es
precision highp float;
in vec2 v_ndc;
uniform mat4 u_invViewProj;
out vec4 outColor;
${COMMON_GLSL}
void main() {
    vec4 p0 = u_invViewProj * vec4(v_ndc, -1.0, 1.0);
    vec4 p1 = u_invViewProj * vec4(v_ndc,  1.0, 1.0);
    vec3 dir = normalize(p1.xyz / p1.w - p0.xyz / p0.w);
    vec3 col = skyColor(dir);
    outColor = vec4(toSRGB(aces(col * u_exposure)), 1.0);
}
`;

const VS_MOB = `#version 300 es
precision highp float;
layout(location = 0) in vec3 a_position;
layout(location = 1) in vec3 a_normal;
layout(location = 2) in vec3 a_color;
uniform mat4 u_projectionMatrix, u_modelViewMatrix;
out vec3 v_normal, v_color, v_worldPos;
void main() {
    v_normal = a_normal; v_color = a_color; v_worldPos = a_position;
    gl_Position = u_projectionMatrix * u_modelViewMatrix * vec4(a_position, 1.0);
}
`;
const FS_MOB = `#version 300 es
precision highp float;
in vec3 v_normal, v_color, v_worldPos;
uniform vec3  u_cameraPosition;
uniform float u_fogDensity;
out vec4 outColor;
${COMMON_GLSL}
void main() {
    vec3 albedo = pow(max(v_color, 0.0), vec3(2.2));
    vec3 N = normalize(v_normal);
    vec3 L = normalize(u_sunDir);
    vec3 V = normalize(u_cameraPosition - v_worldPos);
    vec3 Hv = normalize(L + V);
    float wrap = clamp((max(dot(N, L), 0.0) + 0.25) / 1.25, 0.0, 1.0);
    vec3 color = albedo * (hemiAmbient(N) * 0.75 + u_sunColor * wrap * 1.05);
    color += u_sunColor * pow(max(dot(N, Hv), 0.0), 24.0) * 0.04;
    float dist = length(v_worldPos - u_cameraPosition);
    float fog  = clamp(1.0 - exp(-dist * u_fogDensity), 0.0, 1.0);
    color = mix(color, skyColor(-V), fog);
    outColor = vec4(toSRGB(aces(color * u_exposure)), 1.0);
}
`;

const VS_TREE = `#version 300 es
precision highp float;
layout(location = 0) in vec3 a_position;
layout(location = 1) in vec3 a_normal;
layout(location = 2) in vec3 a_color;
layout(location = 3) in vec3 a_offset;
layout(location = 4) in vec4 a_params;
uniform mat4 u_projectionMatrix, u_modelViewMatrix;
uniform vec3  u_cameraPosition;
uniform float u_time;
uniform float u_fadeStart, u_fadeEnd;
out vec3 v_normal, v_color, v_worldPos;
void main() {
    float sxz = a_params.x, sy = a_params.y, yaw = a_params.z, cv = a_params.w;
    float d    = distance(a_offset.xz, u_cameraPosition.xz);
    float fade = 1.0 - smoothstep(u_fadeStart, u_fadeEnd, d);
    if (fade < 0.02) {
        gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
        v_normal = vec3(0,1,0); v_color = vec3(0); v_worldPos = vec3(0);
        return;
    }
    float c = cos(yaw), s = sin(yaw);
    float fs = 0.35 + 0.65 * fade;
    vec3 p = vec3(a_position.x * sxz * fs, a_position.y * sy * fs, a_position.z * sxz * fs);
    vec3 n = a_normal;
    vec3 rp = vec3(p.x * c - p.z * s, p.y, p.x * s + p.z * c);
    vec3 rn = vec3(n.x * c - n.z * s, n.y, n.x * s + n.z * c);
    float hf = clamp(a_position.y, 0.0, 1.0); hf *= hf;
    float phase = u_time * 1.6 + a_offset.x * 0.21 + a_offset.z * 0.17;
    float swayAmp = sy * 0.022;
    rp.xz += vec2(sin(phase), cos(phase * 0.83)) * swayAmp * hf * fade;
    vec3 world = rp + a_offset;
    v_worldPos = world;
    v_normal   = rn;
    float tint = 0.82 + cv * 0.36;
    v_color = a_color * vec3(tint * (0.94 + 0.12 * cv), tint, tint * (0.96 - 0.10 * cv));
    gl_Position = u_projectionMatrix * u_modelViewMatrix * vec4(world, 1.0);
}
`;

const FS_TREE = `#version 300 es
precision highp float;
in vec3 v_normal, v_color, v_worldPos;
uniform vec3  u_cameraPosition;
uniform float u_fogDensity;
out vec4 outColor;
${COMMON_GLSL}
void main() {
    vec3 albedo = pow(max(v_color, 0.0), vec3(2.2));
    vec3 N = normalize(v_normal);
    vec3 L = normalize(u_sunDir);
    vec3 V = normalize(u_cameraPosition - v_worldPos);
    vec3 Hv = normalize(L + V);
    float wrap = clamp((max(dot(N, L), 0.0) + 0.22) / 1.22, 0.0, 1.0);
    vec3 color = albedo * (hemiAmbient(N) * 0.80 + u_sunColor * wrap * 1.05);
    color += u_sunColor * pow(max(dot(N, Hv), 0.0), 20.0) * 0.035;
    float dist = length(v_worldPos - u_cameraPosition);
    float fog  = clamp(1.0 - exp(-dist * u_fogDensity), 0.0, 1.0);
    color = mix(color, skyColor(-V), fog);
    outColor = vec4(toSRGB(aces(color * u_exposure)), 1.0);
}
`;

/* ════════════════════════════════════════════════════════════
   4 · GL HELPERS
   ════════════════════════════════════════════════════════════ */
function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    console.error('shader:', gl.getShaderInfoLog(s));
  return s;
}
function link(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS))
    console.error('link:', gl.getProgramInfoLog(p));
  return p;
}
function locs(prog, names) {
  const o = {};
  for (const n of names) o[n] = gl.getUniformLocation(prog, n);
  return o;
}
const LIGHT_NAMES = ['u_sunDir','u_sunColor','u_skyTop','u_skyHorizon','u_groundColor','u_exposure'];

const program      = link(VS_TERRAIN, FS_TERRAIN);
const probeProgram = link(VS_PROBE,   FS_PROBE);
const mobProgram   = link(VS_MOB,     FS_MOB);
const treeProgram  = link(VS_TREE,    FS_TREE);
const skyProgram   = link(VS_SKY,     FS_SKY);

const main = locs(program, [
  'u_projectionMatrix','u_modelViewMatrix','u_cameraPos','u_cameraPosition',
  'u_fogDensity','u_baseCell','u_level','u_gridSize','u_texture',
  'u_k','u_p','u_m','u_S_seed','u_edits','u_editCount','u_blocky','u_blockSize','u_mode',
  'u_shadows', ...LIGHT_NAMES
]);
const probe = locs(probeProgram, [
  'u_probeOrigin','u_probeCell','u_probeN','u_k','u_p','u_m','u_S_seed',
  'u_edits','u_editCount','u_blocky','u_blockSize','u_mode','u_gridSize'
]);
const mobU = locs(mobProgram, [
  'u_projectionMatrix','u_modelViewMatrix','u_cameraPosition','u_fogDensity', ...LIGHT_NAMES
]);
const treeU = locs(treeProgram, [
  'u_projectionMatrix','u_modelViewMatrix','u_cameraPosition','u_fogDensity','u_time',
  'u_fadeStart','u_fadeEnd', ...LIGHT_NAMES
]);
const skyU = locs(skyProgram, ['u_invViewProj', ...LIGHT_NAMES]);

const projectionMatrix = mat4.create();
mat4.perspective(projectionMatrix, Math.PI/4, canvas.width/canvas.height, 0.5, 250000);

function pushLighting(prog, L) {
  gl.useProgram(prog);
  gl.uniform3f(L.u_sunDir,      ...SUN_DIR);
  gl.uniform3f(L.u_sunColor,    ...SUN_COLOR);
  gl.uniform3f(L.u_skyTop,      ...currentSkyTop);
  gl.uniform3f(L.u_skyHorizon,  ...currentSky);
  gl.uniform3f(L.u_groundColor, ...currentGround);
  gl.uniform1f(L.u_exposure,    EXPOSURE);
}
function pushLightingAll() {
  pushLighting(program,      main);
  pushLighting(mobProgram,   mobU);
  pushLighting(treeProgram,  treeU);
  pushLighting(skyProgram,   skyU);
  gl.useProgram(program);
}

gl.clearColor(...currentSky, 1);
gl.enable(gl.DEPTH_TEST);
gl.enable(gl.CULL_FACE);
gl.cullFace(gl.BACK);
gl.frontFace(gl.CW);

function pushTerrainUniforms() {
  gl.useProgram(program);
  gl.uniform1f(main.u_k, TERRAIN.k);
  gl.uniform1f(main.u_p, TERRAIN.p);
  gl.uniform1f(main.u_m, TERRAIN.m);
  gl.uniform1f(main.u_S_seed, TERRAIN.seed);
  gl.useProgram(probeProgram);
  gl.uniform1f(probe.u_k, TERRAIN.k);
  gl.uniform1f(probe.u_p, TERRAIN.p);
  gl.uniform1f(probe.u_m, TERRAIN.m);
  gl.uniform1f(probe.u_S_seed, TERRAIN.seed);
  gl.useProgram(program);
}
pushTerrainUniforms();
pushLightingAll();

const editData = new Float32Array(MAX_EDITS * 4);
function uploadEdits(L) {
  editData.fill(0);
  for (let i = 0; i < edits.length; i++) editData.set(edits[i], i * 4);
  gl.uniform4fv(L.u_edits, editData);
  gl.uniform1i(L.u_editCount, edits.length);
}
function uploadTerrainState(L, gridSize) {
  gl.uniform1f(L.u_blocky,    modeIndex === 1 ? 1 : 0);
  gl.uniform1f(L.u_blockSize, blockSize);
  gl.uniform1f(L.u_mode,      modeIndex);
  if (L.u_gridSize && gridSize !== undefined) gl.uniform1f(L.u_gridSize, gridSize);
}

/* ════════════════════════════════════════════════════════════
   5 · HEIGHTMAP PROBE
   ════════════════════════════════════════════════════════════ */
if (!gl.getExtension('EXT_color_buffer_float'))
  console.warn('EXT_color_buffer_float unavailable');

const HMAP_N     = 256;
const HMAP_WORLD = 384;
const HMAP_CELL  = HMAP_WORLD / HMAP_N;
const hmapData   = new Float32Array(HMAP_N * HMAP_N * 4);
let hmapOriginX = 0, hmapOriginZ = 0;

const probeTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, probeTex);
gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, HMAP_N, HMAP_N, 0, gl.RGBA, gl.FLOAT, null);
for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.NEAREST],
                      [gl.TEXTURE_MAG_FILTER, gl.NEAREST],
                      [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE],
                      [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]])
  gl.texParameteri(gl.TEXTURE_2D, k, v);

const probeFBO = gl.createFramebuffer();
gl.bindFramebuffer(gl.FRAMEBUFFER, probeFBO);
gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, probeTex, 0);
gl.bindFramebuffer(gl.FRAMEBUFFER, null);

function probeBegin() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, probeFBO);
  gl.viewport(0, 0, HMAP_N, HMAP_N);
  gl.useProgram(probeProgram);
  uploadEdits(probe);
  uploadTerrainState(probe);
  gl.bindVertexArray(null);
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.CULL_FACE);
}
function probeEnd() {
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);
  gl.useProgram(program);
}

let lastHeightmapTime = -1e9;
const HMAP_INTERVAL_MS = 100;

function updateHeightmap(force) {
  const now = performance.now();
  if (!force && now - lastHeightmapTime < HMAP_INTERVAL_MS) return;
  lastHeightmapTime = now;
  hmapOriginX = targetPosition[0] - HMAP_WORLD * .5;
  hmapOriginZ = targetPosition[2] - HMAP_WORLD * .5;
  probeBegin();
  gl.uniform1i(probe.u_probeN, HMAP_N);
  gl.uniform2f(probe.u_probeOrigin, hmapOriginX, hmapOriginZ);
  gl.uniform1f(probe.u_probeCell, HMAP_CELL);
  gl.drawArrays(gl.POINTS, 0, HMAP_N * HMAP_N);
  gl.readPixels(0, 0, HMAP_N, HMAP_N, gl.RGBA, gl.FLOAT, hmapData);
  probeEnd();
}

function cachedHeightAt(x, z) {
  if (modeIndex === 1 || modeIndex === 2)
    { x = (Math.floor(x/blockSize) + .5) * blockSize;
      z = (Math.floor(z/blockSize) + .5) * blockSize; }
  const fx = (x - hmapOriginX) / HMAP_CELL;
  const fz = (z - hmapOriginZ) / HMAP_CELL;
  let ix = Math.floor(fx), iz = Math.floor(fz);
  let tx = fx - ix, tz = fz - iz;
  if (ix < 0) { ix = 0; tx = 0; }
  if (iz < 0) { iz = 0; tz = 0; }
  if (ix > HMAP_N - 2) { ix = HMAP_N - 2; tx = 1; }
  if (iz > HMAP_N - 2) { iz = HMAP_N - 2; tz = 1; }
  const i00 = (iz * HMAP_N + ix) * 4;
  const i10 = i00 + 4;
  const i01 = i00 + HMAP_N * 4;
  const i11 = i01 + 4;
  const h0 = hmapData[i00] * (1 - tx) + hmapData[i10] * tx;
  const h1 = hmapData[i01] * (1 - tx) + hmapData[i11] * tx;
  return h0 * (1 - tz) + h1 * tz;
}

const bnoise = (x, y) =>
    Math.sin(x * .0125) * Math.cos(y * .0107)
  + .5  * Math.sin(x * .0310 + 1.7) * Math.cos(y * .0265 - .9)
  + .25 * Math.sin(x * .0710 + 4.1) * Math.cos(y * .0663 + 2.2);

const smoothstepJS = (e0, e1, x) => {
  let t = (x - e0) / (e1 - e0);
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return t * t * (3 - 2 * t);
};

function biomeWeights(x, z) {
  const t = bnoise(x + 1234.5, z + 567.8);
  const m = bnoise(x * 1.3 - 987.6, z * 1.3 + 321.4);
  const snow   = 1 - smoothstepJS(-.45, -.05, t);
  const desert = smoothstepJS(.10, .50, t) * (1 - smoothstepJS(-.25, .10, m));
  const forest = smoothstepJS(.05, .45, m);
  const plains = 1;
  const sum = snow + desert + forest + plains;
  return [plains/sum, forest/sum, desert/sum, snow/sum];
}

/* ════════════════════════════════════════════════════════════
   6 · MOBS
   ════════════════════════════════════════════════════════════ */
const mobs = [];
const MAX_MOBS = 28;
const PLAYER_RADIUS = .5;
const DESPAWN_DIST = 145;
const MOB_MAX_BOXES = 8;
const VERTS_PER_BOX = 36;
const FLOATS_PER_VERT = 9;
let nextMobId = 1;
let spawnTimer = 1;
let isMobHost = true;

const ANIMAL_SKINS = [
  {body:[.93,.93,.91], head:[.84,.81,.76]},
  {body:[.56,.38,.24], head:[.44,.29,.18]},
  {body:[.93,.62,.66], head:[.88,.53,.57]},

    x:+position[0].toFixed(2), y:+position[1].toFixed(2), z:+position[2].toFixed(2),

  if (p.id === ID) return;
  let rp = remotePlayers[p.id];
  if (!rp) {
    rp = remotePlayers[p.id] = {
      id:p.id, name:p.name,
      x:p.x, y:p.y, z:p.z, yaw:p.yaw || 0,
      targetX:p.x, targetY:p.y, targetZ:p.z, targetYaw:p.yaw || 0,
      color: colorForId(p.id)
    };
  } else {
    rp.name = p.name || rp.name;

function updateRemotePlayers() {

    const rp = remotePlayers[id];
    rp.x += (rp.targetX - rp.x) * .2;
    rp.y += (rp.targetY - rp.y) * .2;
    rp.z += (rp.targetZ - rp.z) * .2;
    let dy = rp.targetYaw - rp.yaw;

    while (dy < -Math.PI) dy += Math.PI * 2;
    rp.yaw += dy * .2;

  let hash = 0;
  for (let i = 0; i < id.length; i++) hash = (hash * 31 + id.charCodeAt(i)) >>> 0;

  const a = .85 * Math.min(.6, .4);
  const f = n => {
    const k = (n + h * 12) % 12;
    return .6 - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
  };
  return [f(0), f(8), f(4)];
}

<!-- ══════════════════════════════════════════════════════════════

<script>
(function () {
'use strict';

const $ = id => document.getElementById(id);

/* ══════════════════════════════════════════════════════════
   0 · SOUND EFFECTS

const sfx = { master:null, ready:false, screamBus:null };

function ensureAudio() {
  try {
    if (!music.ctx) initAudio();
    if (!music.ctx) return false;
    if (music.ctx.state === 'suspended') music.ctx.resume();
    if (!sfx.ready) {
      sfx.master = music.ctx.createGain();
      sfx.master.gain.value = 0.55;
      sfx.master.connect(music.ctx.destination);
      const conv = music.ctx.createConvolver();
      conv.buffer = makeImpulseResponse(music.ctx, 3.2, 2.2);
      sfx.screamBus = music.ctx.createGain();
      sfx.screamBus.gain.value = 0.42;
      sfx.screamBus.connect(conv);
      conv.connect(sfx.master);
      sfx.ready = true;
    }
    return true;
  } catch (e) { return false; }
}

function noiseBurst(ctx, dur, decayPow, filterType, freq, q) {
  const n = Math.max(64, Math.floor(ctx.sampleRate * dur));
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, decayPow);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const f = ctx.createBiquadFilter();
  f.type = filterType || 'bandpass';
  f.frequency.value = freq || 900;
  f.Q.value = q || 0.8;
  src.connect(f);
  return { src, filter: f };
}

function playSfx(kind) {
  if (!ensureAudio()) return;
  const ctx = music.ctx, t = ctx.currentTime;
  try {
    if (kind === 'gunshot') {
      const burst = noiseBurst(ctx, 0.22, 3, 'bandpass', 1100, 0.7);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.6, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      burst.filter.connect(g); g.connect(sfx.master);
      burst.src.start(t); burst.src.stop(t + 0.24);
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(160, t);
      o.frequency.exponentialRampToValueAtTime(42, t + 0.16);
      const og = ctx.createGain();
      og.gain.setValueAtTime(0.4, t);
      og.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      o.connect(og); og.connect(sfx.master); o.start(t); o.stop(t + 0.2);
      return;
    }
    if (kind === 'zombie') {
      const o = ctx.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(90 + Math.random()*30, t);
      o.frequency.exponentialRampToValueAtTime(45, t + 1.1);
      const wob = ctx.createOscillator(); wob.frequency.value = 8 + Math.random()*6;
      const wg = ctx.createGain(); wg.gain.value = 12;
      wob.connect(wg); wg.connect(o.frequency);
      const f = ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 1100;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.24, t + 0.15);
      g.gain.exponentialRampToValueAtTime(0.001, t + 1.25);
      o.connect(f); f.connect(g);
      g.connect(sfx.master); g.connect(sfx.screamBus);
      o.start(t); wob.start(t); o.stop(t + 1.3); wob.stop(t + 1.3);
      return;
    }
    if (kind === 'skeleton') {
      const o = ctx.createOscillator(); o.type = 'square';
      o.frequency.setValueAtTime(420 + Math.random()*90, t);
      o.frequency.exponentialRampToValueAtTime(180, t + 0.75);
      const f = ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value = 500;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.14, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.85);
      o.connect(f); f.connect(g);
      g.connect(sfx.master); g.connect(sfx.screamBus);
      o.start(t); o.stop(t + 0.95);
      const burst = noiseBurst(ctx, 0.4, 5, 'highpass', 2400, 1.1);
      const bg = ctx.createGain(); bg.gain.value = 0.24;
      burst.filter.connect(bg); bg.connect(sfx.master);
      burst.src.start(t); burst.src.stop(t + 0.45);
      return;
    }
    if (kind === 'brute') {
      const o = ctx.createOscillator(); o.type='sawtooth';
      o.frequency.setValueAtTime(48, t);
      o.frequency.exponentialRampToValueAtTime(26, t + 1.6);
      const f = ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 700;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.42, t + 0.2);
      g.gain.exponentialRampToValueAtTime(0.001, t + 1.9);
      o.connect(f); f.connect(g);
      g.connect(sfx.master); g.connect(sfx.screamBus);
      o.start(t); o.stop(t + 2.0);
      return;
    }
    if (kind === 'spider') {
      for (let i = 0; i < 8; i++) {
        const o = ctx.createOscillator(); o.type='triangle';
        const base = 1400 + Math.random()*900;
        o.frequency.setValueAtTime(base, t + i*0.045);
        o.frequency.exponentialRampToValueAtTime(base*0.6, t + i*0.045 + 0.06);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.09, t + i*0.045);
        g.gain.exponentialRampToValueAtTime(0.001, t + i*0.045 + 0.09);
        o.connect(g); g.connect(sfx.master);
        o.start(t + i*0.045); o.stop(t + i*0.045 + 0.1);
      }
      return;
    }
    if (kind === 'creeper_fuse') {
      const burst = noiseBurst(ctx, 1.6, 0.4, 'highpass', 1800, 0.6);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.05, t);
      g.gain.linearRampToValueAtTime(0.32, t + 1.4);
      const p = ctx.createOscillator(); p.type='sawtooth';
      p.frequency.setValueAtTime(220, t);
      p.frequency.linearRampToValueAtTime(720, t + 1.4);
      const pg = ctx.createGain(); pg.gain.value = 0.06;
      p.connect(pg); pg.connect(g);

      burst.src.start(t); burst.src.stop(t + 1.7);
      p.start(t); p.stop(t + 1.7);

    if (kind === 'creeper_boom') {
      const burst = noiseBurst(ctx, 1.0, 1.8, 'lowpass', 380, 0.9);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.75, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.85);
      burst.filter.connect(g); g.connect(sfx.master);
      burst.src.start(t); burst.src.stop(t + 0.95);
      const o = ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(140, t);
      o.frequency.exponentialRampToValueAtTime(28, t + 0.7);
      const og = ctx.createGain();
      og.gain.setValueAtTime(0.55, t);
      og.gain.exponentialRampToValueAtTime(0.001, t + 0.75);
      o.connect(og); og.connect(sfx.master);
      o.start(t); o.stop(t + 0.8);
      return;
    }
    if (kind === 'hit') {
      const o = ctx.createOscillator(); o.type='triangle';
      o.frequency.setValueAtTime(900, t);
      o.frequency.exponentialRampToValueAtTime(220, t + 0.14);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.22, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
      o.connect(g); g.connect(sfx.master); o.start(t); o.stop(t + 0.18);

    }
    if (kind === 'hurt') {
      const o = ctx.createOscillator(); o.type='square';
      o.frequency.setValueAtTime(220, t);
      o.frequency.exponentialRampToValueAtTime(65, t + 0.32);

      g.gain.setValueAtTime(0.24, t);

      o.frequency.setValueAtTime(880, t);
      o.frequency.exponentialRampToValueAtTime(1360, t + 0.12);

      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.17, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      o.connect(g); g.connect(sfx.master); o.start(t); o.stop(t + 0.3);

      for (let v = 0; v < 3; v++) {
        const o = ctx.createOscillator();

        const base = 380 + v * 90 + Math.random() * 40;
        o.frequency.setValueAtTime(base, t);
        o.frequency.linearRampToValueAtTime(base * (1.4 + Math.random()*0.4), t + 0.5);
        o.frequency.exponentialRampToValueAtTime(base * 0.42, t + 1.6);
        const f = ctx.createBiquadFilter();
        f.type='bandpass'; f.frequency.value = base * 1.2; f.Q.value = 3.2;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.14, t + 0.15);
        g.gain.linearRampToValueAtTime(0.12, t + 0.9);
        g.gain.exponentialRampToValueAtTime(0.001, t + 1.9);
        o.connect(f); f.connect(g);
        g.connect(sfx.master); g.connect(sfx.screamBus);
        o.start(t); o.stop(t + 2.0);
      }
      const burst = noiseBurst(ctx, 1.8, 1.4, 'bandpass', 1400, 1.2);
      const bg = ctx.createGain();
      bg.gain.setValueAtTime(0, t);
      bg.gain.linearRampToValueAtTime(0.09, t + 0.4);
      bg.gain.exponentialRampToValueAtTime(0.001, t + 1.9);
      burst.filter.connect(bg); bg.connect(sfx.master); bg.connect(sfx.screamBus);
      burst.src.start(t); burst.src.stop(t + 2.0);
      return;
    }
  } catch (e) {}
}

const engine = { osc:null, gain:null, lfo:null };
function startEngine() {
  if (!ensureAudio()) return;
  if (engine.osc) return;
  const ctx = music.ctx, t = ctx.currentTime;
  try {
    const o = ctx.createOscillator();
    o.type = 'sawtooth'; o.frequency.value = 65;
    const g = ctx.createGain(); g.gain.value = 0;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 7;
    const lg = ctx.createGain(); lg.gain.value = 5;
    lfo.connect(lg); lg.connect(o.frequency);
    const f = ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 430;
    o.connect(f); f.connect(g); g.connect(sfx.master);
    g.gain.linearRampToValueAtTime(0.10, t + 0.4);
    o.start(t); lfo.start(t);
    engine.osc = o; engine.gain = g; engine.lfo = lfo;
  } catch (e) {}
}
function stopEngine() {
  if (!engine.osc) return;
  const ctx = music.ctx, t = ctx.currentTime;
  try {
    engine.gain.gain.cancelScheduledValues(t);
    engine.gain.gain.setValueAtTime(engine.gain.gain.value, t);
    engine.gain.gain.linearRampToValueAtTime(0, t + 0.25);
    const o = engine.osc, l = engine.lfo;
    setTimeout(() => { try { o.stop(); l.stop(); } catch(e){} }, 400);
  } catch (e) {}
  engine.osc = null; engine.gain = null; engine.lfo = null;
}

/* ══════════════════════════════════════════════════════════

const dayNight = {
  time: 0.28, cycleSec: 200, enabled: true,
  isNight: false, nightFactor: 0, nextScream: 4
};

function updateDayNight(dt) {
  if (!dayNight.enabled) return;
  dayNight.time = (dayNight.time + dt / dayNight.cycleSec) % 1;
  const sunA = (dayNight.time - 0.25) * Math.PI * 2;
  const sy   = Math.sin(sunA);
  const sx   = Math.cos(sunA) * 0.6;
  SUN_DIR[0] = sx;
  SUN_DIR[1] = Math.max(-0.4, sy);
  SUN_DIR[2] = 0.30;
  const nf = Math.max(0, Math.min(1, 1 - (sy + 0.14) * 3));
  dayNight.nightFactor = nf;
  dayNight.isNight = nf > 0.55;
  const warm = Math.max(0, 1 - Math.abs(sy) * 2.2);
  SUN_COLOR[0] = 1.05 * (1 - nf * 0.72) + 0.18 * nf + warm * 0.15;
  SUN_COLOR[1] = 1.00 * (1 - nf * 0.72) + 0.16 * nf + warm * 0.05;
  SUN_COLOR[2] = 0.90 * (1 - nf * 0.85) + 0.30 * nf - warm * 0.10;
  if (dayNight.isNight && survival.on) {
    dayNight.nextScream -= dt;
    if (dayNight.nextScream <= 0) {
      dayNight.nextScream = 5 + Math.random() * 10;
      playSfx('scream');
    }
  }
}

function applyNightTint() {
  const nf = dayNight.nightFactor;
  if (nf <= 0.01) return;
  const nightSky  = [0.020, 0.030, 0.075];
  const nightTop  = [0.010, 0.015, 0.045];
  const nightGnd  = [0.020, 0.025, 0.040];
  for (let i = 0; i < 3; i++) {
    currentSky[i]     = currentSky[i]     * (1 - nf * 0.88) + nightSky[i] * nf * 0.88;
    currentSkyTop[i]  = currentSkyTop[i]  * (1 - nf * 0.92) + nightTop[i] * nf * 0.92;
    currentGround[i]  = currentGround[i]  * (1 - nf * 0.85) + nightGnd[i] * nf * 0.85;
  }
  gl.clearColor(...currentSky, 1);
  pushLightingAll();
}

/* ══════════════════════════════════════════════════════════

const car = {

};
car.y = cachedHeightAt(car.x, car.z) + 0.5;
car.netY = car.y;

function enterCar() {
  if (car.driverId && car.driverId !== ID) return;
  car.driving  = true;
  car.driverId = ID;
  car.speed    = 0;
  flightMode   = false;
  updateFlyLabel();
  startEngine();
  scheduleWorldBroadcast();
  sendCarState(true);
  updateCarBtn();
}
function exitCar() {
  if (!car.driving) return;
  car.driving  = false;
  car.driverId = null;
  car.speed    = 0;
  stopEngine();
  const rx = Math.cos(car.yaw), rz = Math.sin(car.yaw);
  targetPosition[0] = car.x + rx * 3.2;
  targetPosition[2] = car.z + rz * 3.2;
  targetPosition[1] = cachedHeightAt(targetPosition[0], targetPosition[2]) + EYE_HEIGHT;
  velocityY = 0; grounded = true;
  scheduleWorldBroadcast();
  sendCarState(true);
  updateCarBtn();
}
function tryToggleCar() {
  if (car.driving) { exitCar(); return; }
  if (car.driverId && car.driverId !== ID) return;
  const dx = targetPosition[0] - car.x, dz = targetPosition[2] - car.z;
  if (dx*dx + dz*dz < 36) { enterCar(); return; }
  const fx = Math.sin(mouseX), fz = -Math.cos(mouseX);
  car.x = targetPosition[0] + fx * 4;
  car.z = targetPosition[2] + fz * 4;
  car.yaw = mouseX;
  car.y = cachedHeightAt(car.x, car.z) + 0.5;
  car.netX = car.x; car.netY = car.y; car.netZ = car.z; car.netYaw = car.yaw;
  enterCar();
}
function updateCar(dt) {
  if (car.driving) {
    let thr = 0, str = 0;
    if (keysPressed['w']) thr += 1;
    if (keysPressed['s']) thr -= 1;
    if (keysPressed['a']) str -= 1;
    if (keysPressed['d']) str += 1;
    thr += -joyVec.y;
    str +=  joyVec.x;
    thr = Math.max(-1, Math.min(1, thr));
    str = Math.max(-1, Math.min(1, str));
    const MAXF = 26, MAXR = -9, ACC = 16, BRK = 28, FRIC = 8;
    if (thr > 0.05)       car.speed += ACC * thr * dt;
    else if (thr < -0.05) car.speed += BRK * thr * dt;
    else {
      const s = Math.sign(car.speed);
      car.speed -= s * FRIC * dt;
      if (Math.sign(car.speed) !== s) car.speed = 0;
    }
    car.speed = Math.max(MAXR, Math.min(MAXF, car.speed));
    const sf = Math.min(1, Math.abs(car.speed) / 5);
    car.yaw += str * 1.9 * sf * dt * (car.speed < -0.5 ? -1 : 1);
    const fx = Math.sin(car.yaw), fz = -Math.cos(car.yaw);
    car.x += fx * car.speed * dt;
    car.z += fz * car.speed * dt;
    const gy = cachedHeightAt(car.x, car.z) + 0.5;
    car.y += (gy - car.y) * Math.min(1, dt * 10);
    const back = 9.0, up = 4.0;
    targetPosition[0] = car.x - fx * back;
    targetPosition[1] = car.y + up;
    targetPosition[2] = car.z - fz * back;
    mouseX = car.yaw;
    mouseY = -0.16;
    const k = Math.min(1, dt * 14);
    position[0] += (targetPosition[0] - position[0]) * k;
    position[1] += (targetPosition[1] - position[1]) * k;
    position[2] += (targetPosition[2] - position[2]) * k;
    velocityY = 0; grounded = true;
    if (engine.osc) engine.osc.frequency.value = 60 + Math.abs(car.speed) * 3.2;
  } else if (car.driverId && car.driverId !== ID) {
    car.x += (car.netX - car.x) * 0.28;
    car.y += (car.netY - car.y) * 0.28;
    car.z += (car.netZ - car.z) * 0.28;
    let d = car.netYaw - car.yaw;
    while (d >  Math.PI) d -= Math.PI*2;
    while (d < -Math.PI) d += Math.PI*2;
    car.yaw += d * 0.28;
  } else {
    const gy = cachedHeightAt(car.x, car.z) + 0.5;
    car.y += (gy - car.y) * Math.min(1, dt * 6);
  }
}

/* ══════════════════════════════════════════════════════════
   3 · SURVIVAL MODE + ENEMIES
   ══════════════════════════════════════════════════════════ */
const survival = {
  on: false, hp: 100, maxHp: 100,
  ammo: 6, maxAmmo: 6, recharge: 1.4,
  wood: 0, stone: 0, food: 0, hitCd: 0
};

const enemies = [];
const MAX_ENEMIES_DAY   = 18;
const MAX_ENEMIES_NIGHT = 40;

const ENEMY_DEF = {
  zombie:   { hp:34, speed:2.1,  radius:0.50, color:[0.34,0.62,0.36], dmg:8,  snd:'zombie',   nightBias:3 },
  skeleton: { hp:22, speed:3.0,  radius:0.45, color:[0.90,0.90,0.84], dmg:6,  snd:'skeleton', nightBias:2 },
  brute:    { hp:95, speed:1.45, radius:0.85, color:[0.56,0.22,0.22], dmg:18, snd:'brute',    nightBias:1 },
  spider:   { hp:14, speed:4.2,  radius:0.42, color:[0.14,0.10,0.16], dmg:4,  snd:'spider',   nightBias:3 },
  /* CREEPER: high bias so it spawns a lot, day and night */
  creeper:  { hp:18, speed:2.4,  radius:0.55, color:[0.30,0.72,0.28], dmg:0,  snd:'creeper_fuse', nightBias:6, explodes:true }
};

function pickEnemyType() {
  const night = dayNight.isNight;
  const pool = [];
  for (const k in ENEMY_DEF) {
    const def = ENEMY_DEF[k];
    /* CREEPERS: heavy weight even during the day */
    let w;
    if (k === 'creeper')      w = night ? 8 : 5;
    else if (k === 'zombie')  w = night ? 6 : 3;
    else if (k === 'skeleton')w = night ? 3 : 2;
    else if (k === 'spider')  w = night ? 3 : 1;
    else                      w = 1;
    for (let i = 0; i < w; i++) pool.push(k);
  }
  return pool[(Math.random() * pool.length) | 0];
}

let enemySpawnTimer = 0;
function spawnEnemy(forceType) {
  const type = forceType || pickEnemyType();
  const a = Math.random() * TAU;
  const r = 22 + Math.random() * 28;
  const x = targetPosition[0] + Math.cos(a) * r;
  const z = targetPosition[2] + Math.sin(a) * r;
  const y = cachedHeightAt(x, z);
  const e = {
    type, x, y, z, yaw: 0, walkPhase: Math.random() * 6.28,
    vx: 0, vz: 0, hp: ENEMY_DEF[type].hp,
    netX: x, netY: y, netZ: z, netYaw: 0,
    soundTimer: 1.5 + Math.random() * 4,
    fuse: -1
  };
  enemies.push(e);
  playSfx(ENEMY_DEF[type].snd);
  return e;
}

function creeperExplode(e) {
  playSfx('creeper_boom');
  const dx = targetPosition[0] - e.x, dz = targetPosition[2] - e.z;
  const d = Math.hypot(dx, dz);
  if (d < 6 && !car.driving) {
    const dmg = Math.max(6, 34 * (1 - d / 6));
    survival.hp -= dmg;
    survival.hitCd = 0.9;
    playSfx('hurt');
    if (survival.hp <= 0) respawnPlayer();
  }
  edits.push([e.x, e.z, 8, -4]);
  if (edits.length > 24) edits.shift();
  scheduleWorldBroadcast();
  rebuildTreeInstances(true);
  const i = enemies.indexOf(e);
  if (i >= 0) enemies.splice(i, 1);
  updateSurvivalHud();
}

function updateSurvival(dt) {
  if (survival.hitCd > 0) survival.hitCd -= dt;
  if (!survival.on) { if (enemies.length) enemies.length = 0; return; }

  if (survival.ammo < survival.maxAmmo) {
    survival.recharge -= dt;
    if (survival.recharge <= 0) { survival.ammo++; survival.recharge = 1.4; }
  } else survival.recharge = 1.4;

  if (isMobHost) {
    const cap = dayNight.isNight ? MAX_ENEMIES_NIGHT : MAX_ENEMIES_DAY;
    enemySpawnTimer -= dt;
    if (enemySpawnTimer <= 0 && enemies.length < cap) {
      enemySpawnTimer = dayNight.isNight ? 0.5 + Math.random()*1.0 : 1.4 + Math.random()*1.8;
      spawnEnemy();
      if (Math.random() < 0.55 && enemies.length < cap) spawnEnemy();
      if (dayNight.isNight && Math.random() < 0.5 && enemies.length < cap) spawnEnemy();
    }
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      const def = ENEMY_DEF[e.type];
      const dx = targetPosition[0] - e.x, dz = targetPosition[2] - e.z;
      let d = Math.hypot(dx, dz);
      if (d > 160) { enemies.splice(i, 1); continue; }
      if (d < 1e-3) d = 1e-3;
      const ux = dx/d, uz = dz/d;
      if (def.explodes) {
        if (d < 3.6) {
          if (e.fuse < 0) { e.fuse = 1.35; playSfx('creeper_fuse'); }
          e.fuse -= dt;
          if (e.fuse <= 0) { creeperExplode(e); continue; }
        } else if (e.fuse >= 0) e.fuse = -1;
      }
      const sp = d < 45 ? def.speed : def.speed * 0.32;
      e.vx += (ux * sp - e.vx) * Math.min(1, dt * 4);
      e.vz += (uz * sp - e.vz) * Math.min(1, dt * 4);
      e.x += e.vx * dt; e.z += e.vz * dt;
      const gy = cachedHeightAt(e.x, e.z);
      e.y += (gy - e.y) * Math.min(1, dt * 8);
      if (Math.abs(e.vx) + Math.abs(e.vz) > 0.15) {
        e.yaw = Math.atan2(e.vx, -e.vz);
        e.walkPhase += dt * 6;
      }
      if (!def.explodes && d < 1.3 + def.radius && survival.hitCd <= 0 && !car.driving) {
        survival.hp -= def.dmg;
        survival.hitCd = 0.9;
        playSfx('hurt');
        if (survival.hp <= 0) respawnPlayer();
      }
      e.soundTimer -= dt;
      if (e.soundTimer <= 0) {
        e.soundTimer = (dayNight.isNight ? 2.2 : 4.5) + Math.random() * 5;
        if (d < 45) playSfx(def.snd);
      }
    }
  } else {
    for (const e of enemies) {
      e.x += (e.netX - e.x) * 0.28;
      e.y += (e.netY - e.y) * 0.28;
      e.z += (e.netZ - e.z) * 0.28;
      let dy = e.netYaw - e.yaw;
      while (dy >  Math.PI) dy -= Math.PI*2;
      while (dy < -Math.PI) dy += Math.PI*2;
      e.yaw += dy * 0.28;
      e.walkPhase += dt * 5;
    }
  }

  if (survival.hp < survival.maxHp) {
    survival.hp = Math.min(survival.maxHp, survival.hp + dt * (dayNight.isNight ? 0.6 : 2.2));
  }
}

/* ══════════════════════════════════════════════════════════
   4 · GUN
   ══════════════════════════════════════════════════════════ */
let muzzleFlashT = 0;
let hitMarkerT   = 0;

function shoot() {
  if (!survival.on) return;
  ensureAudio();
  if (survival.ammo <= 0) { playSfx('hit'); return; }
  survival.ammo--;
  if (survival.recharge > 1.4) survival.recharge = 1.4;
  playSfx('gunshot');
  muzzleFlashT = 0.09;
  const cp = Math.cos(mouseY);
  const dx0 = Math.sin(mouseX) * cp;
  const dy0 = Math.sin(mouseY);
  const dz0 = -Math.cos(mouseX) * cp;
  const ox = position[0], oy = position[1], oz = position[2];
  let hitAnything = false;
  for (let pellet = 0; pellet < 4; pellet++) {
    const sx = (Math.random() - 0.5) * 0.045;
    const sy = (Math.random() - 0.5) * 0.045;
    const sz = (Math.random() - 0.5) * 0.045;
    const rl = Math.hypot(dx0 + sx, dy0 + sy, dz0 + sz);
    const rx = (dx0 + sx)/rl, ry = (dy0 + sy)/rl, rz = (dz0 + sz)/rl;
    let best = null, bestT = 70;
    for (const e of enemies) {
      const def = ENEMY_DEF[e.type];
      const ex = e.x - ox, ey = (e.y + 1.1) - oy, ez = e.z - oz;
      const t = ex*rx + ey*ry + ez*rz;
      if (t < 0.4 || t > bestT) continue;
      const px = ox + rx*t, py = oy + ry*t, pz = oz + rz*t;
      const hitR = 1.05 + def.radius * 0.9;
      const dd = Math.hypot(e.x - px, (e.y + 1.1) - py, e.z - pz);
      if (dd < hitR) { best = e; bestT = t; }
    }
    if (best) {
      best.hp -= 9 + Math.random() * 8;
      hitAnything = true;
      if (best.hp <= 0) {
        const idx = enemies.indexOf(best);
        if (idx >= 0) enemies.splice(idx, 1);
        survival.food += 1;
        if (Math.random() < 0.4) survival.stone += 1;
        if (Math.random() < 0.3) survival.wood  += 1;
      }
    }
  }
  if (hitAnything) { playSfx('hit'); hitMarkerT = 0.12; }
  updateSurvivalHud();
}

/* ══════════════════════════════════════════════════════════
   5 · RESPAWN
   ══════════════════════════════════════════════════════════ */
function respawnPlayer() {
  if (car.driving) exitCar();
  const gy = cachedHeightAt(0, 0) + EYE_HEIGHT;
  targetPosition = [0, gy, 0];
  position       = [0, gy, 0];
  velocityY = 0; grounded = true;
  survival.hp = survival.maxHp;
  survival.hitCd = 1.5;
  if (survival.on) { enemies.length = 0; enemySpawnTimer = 2; }
  playSfx('hit');
  updateSurvivalHud();
}

/* ══════════════════════════════════════════════════════════
   6 · STRUCTURES
   ══════════════════════════════════════════════════════════ */
const STRUCT_DEFS = [
  { name:'hut',      res:'wood',  amt:3 },
  { name:'tower',    res:'stone', amt:4 },
  { name:'crates',   res:'food',  amt:3 },
  { name:'campfire', res:'food',  amt:2 },
  { name:'ruins',    res:'stone', amt:3 },
  { name:'house',    res:'wood',  amt:5 }
];
const STRUCT_CELL   = 40;   /* tighter grid = more structures per area */
const STRUCT_RADIUS = 230;
const structures    = [];
const gatheredAt    = new Map();
let lastStructX = 1e9, lastStructZ = 1e9;

function rebuildStructures(force) {
  const cx = targetPosition[0], cz = targetPosition[2];
  if (!force && Math.hypot(cx - lastStructX, cz - lastStructZ) < 24) return;
  lastStructX = cx; lastStructZ = cz;
  structures.length = 0;
  const R   = Math.ceil(STRUCT_RADIUS / STRUCT_CELL);
  const cix = Math.round(cx / STRUCT_CELL), ciz = Math.round(cz / STRUCT_CELL);
  const seed = (Math.floor(TERRAIN.seed * 1000) | 0) ^ 0x9e37;
  for (let dz = -R; dz <= R; dz++) {
    for (let dx = -R; dx <= R; dx++) {
      const gx = cix + dx, gz = ciz + dz;
      /* sparser check = fewer structures, raise threshold to 0.55 to spawn more */
      if (hash2(gx, gz, seed) > 0.55) continue;
      const r1 = hash2(gx + 101, gz - 203, seed);
      const r2 = hash2(gx - 307, gz + 509, seed);
      const r3 = hash2(gx + 701, gz + 907, seed);
      const r4 = hash2(gx - 1103, gz - 1301, seed);
      const px = (gx + r1) * STRUCT_CELL;
      const pz = (gz + r2) * STRUCT_CELL;
      const ddx = px - cx, ddz = pz - cz;
      if (ddx*ddx + ddz*ddz > STRUCT_RADIUS*STRUCT_RADIUS) continue;
      const y = cachedHeightAt(px, pz);
      if (y > 30) continue;
      const type  = Math.floor(r3 * STRUCT_DEFS.length) % STRUCT_DEFS.length;
      const scale = 0.9 + r4 * 0.6;
      const yaw   = hash2(gx + 211, gz - 223, seed) * TAU;
      structures.push({ x: px, y: y - 0.05, z: pz, yaw, type, scale, gx, gz });
      if (structures.length > 180) return;
    }
  }
}
function updateStructures(dt) {
  const now = performance.now();
  for (const s of structures) {
    const dx = targetPosition[0] - s.x, dz = targetPosition[2] - s.z;
    if (dx*dx + dz*dz > 9) continue;
    const key = s.gx + '_' + s.gz;
    if (now - (gatheredAt.get(key) || 0) < 9000) continue;
    gatheredAt.set(key, now);
    const def = STRUCT_DEFS[s.type];
    survival[def.res] += def.amt;
    playSfx('gather');
    updateSurvivalHud();
    break;
  }
}

const EXTRA_BOX_CAP = 4000;

const extraVBO  = gl.createBuffer();

gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, EXTRA_STRIDE, 12);
gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 3, gl.FLOAT, false, EXTRA_STRIDE, 24);

function appendCar(out, k, c) {
  const co = Math.cos(c.yaw), si = Math.sin(c.yaw);
  const B = (ox,oy,oz,hx,hy,hz,col) =>
    pushRotBox(out, k, c.x, c.y, c.z, co, si, ox,oy,oz, hx,hy,hz, col[0],col[1],col[2]);
  const body  = [0.85, 0.16, 0.13];
  const cabin = [0.92, 0.60, 0.16];

  const lamp  = [1.00, 0.95, 0.55];
  B( 0,     0.00,  0.00, 1.00, 0.32, 2.00, body);
  B( 0,     0.46,  0.15, 0.82, 0.28, 1.05, cabin);
  B( 0,     0.46, -0.52, 0.78, 0.26, 0.06, glass);
  B( 0,     0.46,  0.78, 0.78, 0.26, 0.06, glass);
  B(-0.62,  0.06, -1.96, 0.16, 0.10, 0.06, lamp);
  B( 0.62,  0.06, -1.96, 0.16, 0.10, 0.06, lamp);
  for (const [wx, wz] of [[-1.02,-1.25],[1.02,-1.25],[-1.02,1.25],[1.02,1.25]]) {
    B(wx, -0.28, wz, 0.16, 0.22, 0.36, wheel);
  }
  return k;
}

function appendEnemy(out, k, e) {
  const cos = Math.cos(e.yaw), sin = Math.sin(e.yaw);
  const swing = Math.sin(e.walkPhase) * 0.25;
  const c = ENEMY_DEF[e.type].color;
  const dark = [c[0]*0.55, c[1]*0.55, c[2]*0.55];
  const B = (ox,oy,oz,hx,hy,hz,col) =>
    pushRotBox(out, k, e.x, e.y, e.z, cos, sin, ox,oy,oz, hx,hy,hz, col[0],col[1],col[2]);

  if (e.type === 'creeper') {
    const flash = e.fuse >= 0 && Math.sin(e.fuse * 40) > 0;
    const body  = flash ? [0.95, 0.95, 0.95] : c;
    B(0, 0.90, 0, 0.42, 0.60, 0.30, body);
    B(0, 1.55, 0, 0.30, 0.26, 0.28, body);
    B(-0.16, 1.66, -0.16, 0.06, 0.06, 0.06, [0.10, 0.10, 0.10]);
    B( 0.16, 1.66, -0.16, 0.06, 0.06, 0.06, [0.10, 0.10, 0.10]);
    B(-0.26, 0.28,  swing, 0.14, 0.28, 0.14, dark);
    B( 0.26, 0.28, -swing, 0.14, 0.28, 0.14, dark);
    return k;
  }
  if (e.type === 'spider') {
    B(0, 0.55, 0, 0.55, 0.26, 0.42, c);
    B(0, 0.62, -0.55, 0.32, 0.28, 0.28, c);
    B(-0.12, 0.70, -0.72, 0.05, 0.05, 0.05, [1,0.12,0.10]);
    B( 0.12, 0.70, -0.72, 0.05, 0.05, 0.05, [1,0.12,0.10]);
    for (let i = 0; i < 4; i++) {
      const off = -0.4 + i * 0.26;
      B(-0.55, 0.35, off, 0.30, 0.05, 0.05, dark);
      B( 0.55, 0.35, off, 0.30, 0.05, 0.05, dark);
    }
    return k;
  }
  const scale = e.type === 'brute' ? 1.4 : 1.0;
  B(-0.15*scale, 0.34*scale,  swing, 0.13*scale, 0.34*scale, 0.13*scale, dark);
  B( 0.15*scale, 0.34*scale, -swing, 0.13*scale, 0.34*scale, 0.13*scale, dark);
  B( 0.00, 1.10*scale, 0.00, 0.30*scale, 0.44*scale, 0.17*scale, c);
  B(-0.38*scale, 1.25*scale, -0.30*scale, 0.10*scale, 0.10*scale, 0.38*scale, c);
  B( 0.38*scale, 1.25*scale, -0.30*scale, 0.10*scale, 0.10*scale, 0.38*scale, c);
  B( 0.00, 1.75*scale, 0.00, 0.26*scale, 0.26*scale, 0.26*scale, c);
  B(-0.08*scale, 1.80*scale, -0.24*scale, 0.035, 0.035, 0.035, [1.0, 0.15, 0.10]);
  B( 0.08*scale, 1.80*scale, -0.24*scale, 0.035, 0.035, 0.035, [1.0, 0.15, 0.10]);
  return k;
}

function appendStructure(out, k, s) {
  const c = Math.cos(s.yaw), sn = Math.sin(s.yaw), sc = s.scale;
  const B = (ox,oy,oz,hx,hy,hz,col) =>
    pushRotBox(out, k, s.x, s.y, s.z, c, sn,
               ox*sc, oy*sc, oz*sc, hx*sc, hy*sc, hz*sc,
               col[0], col[1], col[2]);
  const wood  = [0.55, 0.35, 0.18];
  const woodD = [0.35, 0.22, 0.10];
  const stone = [0.55, 0.55, 0.58];
  const stoneD= [0.36, 0.36, 0.39];
  const roof  = [0.62, 0.24, 0.14];
  const fire  = [1.00, 0.60, 0.15];
  const flame = [1.00, 0.88, 0.35];
  const crate = [0.66, 0.44, 0.20];
  const door  = [0.30, 0.20, 0.10];
  const glass = [0.55, 0.78, 0.92];

  const t = s.type;
  if (t === 0) {
    B(0, 0.05, 0, 0.62, 0.05, 0.62, woodD);
    B(-0.55, 0.32,  0.00, 0.06, 0.30, 0.60, wood);
    B( 0.55, 0.32,  0.00, 0.06, 0.30, 0.60, wood);
    B( 0.00, 0.32, -0.55, 0.60, 0.30, 0.06, wood);
    B(-0.30, 0.32,  0.55, 0.24, 0.30, 0.06, wood);
    B( 0.30, 0.32,  0.55, 0.24, 0.30, 0.06, wood);
    B(0, 0.62, 0, 0.65, 0.05, 0.65, roof);
    B(0, 0.72, 0, 0.55, 0.06, 0.55, roof);
    B(0, 0.82, 0, 0.40, 0.06, 0.40, roof);
  } else if (t === 1) {
    for (let i = 0; i < 8; i++) {
      const w = 0.48 - i * 0.025;
      B(0, 0.09 + i*0.11, 0, w, 0.06, w, i % 2 ? stone : stoneD);
    }
    B(0, 0.98, 0, 0.55, 0.06, 0.55, stone);
    for (let i = 0; i < 4; i++) {
      const a = i / 4 * TAU + 0.4;
      B(Math.cos(a)*0.42, 1.10, Math.sin(a)*0.42, 0.11, 0.11, 0.11, stone);
    }
  } else if (t === 2) {
    const r = mulberry32((s.gx * 73856093) ^ (s.gz * 19349663));
    for (let i = 0; i < 8; i++) {
      const x = (r() - 0.5) * 0.7, z = (r() - 0.5) * 0.7;
      const y = 0.12 + Math.floor(i / 3) * 0.22;
      B(x, y, z, 0.16, 0.11, 0.16, crate);
    }
  } else if (t === 3) {
    B(0, 0.03, 0, 0.42, 0.03, 0.42, [0.28, 0.20, 0.12]);
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * TAU;
      B(Math.cos(a)*0.13, 0.08, Math.sin(a)*0.13, 0.07, 0.06, 0.07, fire);
    }
    B(0, 0.18, 0, 0.09, 0.15, 0.09, flame);
  } else if (t === 4) {
    const r = mulberry32((s.gx * 83492791) ^ (s.gz * 29874321));
    for (let i = 0; i < 9; i++) {
      const a  = i / 9 * TAU + r() * 0.6;
      const rr = 0.35 + r() * 0.25;
      const hh = 0.15 + r() * 0.42;
      B(Math.cos(a)*rr, hh, Math.sin(a)*rr, 0.11, hh, 0.11, i % 2 ? stone : stoneD);
    }
    B(0.55, 0.09, 0.15, 0.32, 0.09, 0.09, stone);
  } else {
    const W = 0.95, H = 0.85, D = 0.95, wallT = 0.09;
    B(0, 0.04, 0, W+0.14, 0.04, D+0.14, woodD);
    B(0, H/2 + 0.06, -D, W, H/2, wallT, wood);
    B(0, H/2 + 0.06,  D, W, H/2, wallT, wood);
    B(-W, H/2 + 0.06, 0, wallT, H/2, D, wood);
    B( W, H/2 + 0.06, 0, wallT, H/2, D, wood);
    B(-0.55, 0.55, D + 0.01, 0.22, 0.22, 0.02, glass);
    B( 0.55, 0.55, D + 0.01, 0.22, 0.22, 0.02, glass);
    B(0, 0.32, D + 0.02, 0.20, 0.28, 0.03, door);
    B(-W+0.05, H/2 + 0.06, -D+0.05, 0.13, H/2, 0.13, woodD);
    B( W-0.05, H/2 + 0.06, -D+0.05, 0.13, H/2, 0.13, woodD);
    B(-W+0.05, H/2 + 0.06,  D-0.05, 0.13, H/2, 0.13, woodD);
    B( W-0.05, H/2 + 0.06,  D-0.05, 0.13, H/2, 0.13, woodD);
    B(0, H + 0.10, 0, W + 0.15, 0.06, D + 0.15, roof);
    B(0, H + 0.22, 0, W + 0.05, 0.06, D + 0.05, roof);
    B(0, H + 0.34, 0, W - 0.30, 0.06, D - 0.30, roof);
    B(0.45, H + 0.42, 0.35, 0.11, 0.14, 0.11, stoneD);
  }
  return k;
}

function drawExtras() {
  let k = 0;
  const cap = EXTRA_BOX_CAP * VERTS_PER_BOX * FLOATS_PER_VERT;
  const fits = boxes => k + boxes * VERTS_PER_BOX * FLOATS_PER_VERT <= cap;

  if (fits(7))                              k = appendCar(extraData, k, car);
  for (const e of enemies) if (fits(12))    k = appendEnemy(extraData, k, e);
  for (const s of structures) if (fits(30)) k = appendStructure(extraData, k, s);

  if (!k) return;
  gl.useProgram(mobProgram);
  pushLighting(mobProgram, mobU);
  gl.bindVertexArray(extraVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER, extraVBO);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, extraData, 0, k);
  gl.uniformMatrix4fv(mobU.u_projectionMatrix, false, projectionMatrix);
  gl.uniformMatrix4fv(mobU.u_modelViewMatrix,  false, modelViewMatrix);
  gl.uniform3f(mobU.u_cameraPosition, ...position);
  gl.uniform1f(mobU.u_fogDensity, FOG_DENSITY);
  gl.disable(gl.CULL_FACE);
  gl.drawArrays(gl.TRIANGLES, 0, k / FLOATS_PER_VERT);
  gl.enable(gl.CULL_FACE);
  gl.bindVertexArray(null);
  gl.useProgram(program);
}

/* ══════════════════════════════════════════════════════════
   8 · NETWORK — car + enemy sync
   ══════════════════════════════════════════════════════════ */
function sendCarState(force) {
  const now = performance.now();
  if (!force && now - sendCarState._t < 60) return;
  sendCarState._t = now;
  const pkt = JSON.stringify({
    type: 'car',
    driver: car.driverId || '',
    x: +car.x.toFixed(2), y: +car.y.toFixed(2), z: +car.z.toFixed(2),
    yaw: +car.yaw.toFixed(3)
  });
  for (const pid in channels) {
    const ch = channels[pid];
    if (ch && ch.readyState === 'open') try { ch.send(pkt); } catch (e) {}
  }
}
sendCarState._t = 0;

function applyCarState(p) {
  car.driverId = p.driver || null;
  car.netX = p.x; car.netY = p.y; car.netZ = p.z; car.netYaw = p.yaw;
  if (!car.driving && !car.driverId) {
    car.x += (car.netX - car.x) * 0.4;
    car.y += (car.netY - car.y) * 0.4;
    car.z += (car.netZ - car.z) * 0.4;
    let d = car.netYaw - car.yaw;
    while (d >  Math.PI) d -= Math.PI*2;
    while (d < -Math.PI) d += Math.PI*2;
    car.yaw += d * 0.4;
  }
}

let lastEnemySend = 0;
function sendEnemyState() {
  if (!isMobHost || !survival.on) return;
  const now = performance.now();
  if (now - lastEnemySend < 100) return;
  lastEnemySend = now;
  if (!Object.keys(channels).length) return;
  const list = enemies.map(e => ({
    t: e.type,
    x: +e.x.toFixed(2), y: +e.y.toFixed(2), z: +e.z.toFixed(2),
    yaw: +e.yaw.toFixed(2), wp: +e.walkPhase.toFixed(2),
    fz: e.fuse
  }));
  const pkt = JSON.stringify({ type:'enemies', list });
  for (const pid in channels) {
    const ch = channels[pid];
    if (ch && ch.readyState === 'open') try { ch.send(pkt); } catch (e) {}
  }
}

function applyEnemyState(list) {
  if (isMobHost || !survival.on) return;
  while (enemies.length > list.length) enemies.pop();
  for (let i = 0; i < list.length; i++) {
    const inc = list[i];
    let e = enemies[i];
    if (!e) {
      e = { vx:0, vz:0, hp:100, soundTimer:99, x:inc.x, y:inc.y, z:inc.z, yaw:inc.yaw, fuse:-1 };
      enemies[i] = e;
    }
    e.type = inc.t;
    e.netX = inc.x; e.netY = inc.y; e.netZ = inc.z;
    e.netYaw = inc.yaw; e.walkPhase = inc.wp;
    e.fuse = inc.fz;
  }
}

const _handleChannelMessage = handleChannelMessage;
handleChannelMessage = function (peerID, raw) {
  let p = null;
  try { p = JSON.parse(raw); } catch (e) {}
  if (p && typeof p === 'object') {
    if (p.type === 'car')     { applyCarState(p); return; }
    if (p.type === 'enemies') { applyEnemyState(p.list); return; }
  }
  _handleChannelMessage(peerID, raw);
};

/* ══════════════════════════════════════════════════════════
   9 · HUD + BUTTONS
   ══════════════════════════════════════════════════════════ */
const survivalHud = $('survival-hud');
const hpBar       = $('hp-bar');
const ammoText    = $('ammo-text');
const resText     = $('res-text');
const carPrompt   = $('car-prompt');
const survivalBtn = $('survival-btn');
const carBtn      = $('car-btn');

function updateSurvivalHud() {
  hpBar.style.width = Math.max(0, survival.hp / survival.maxHp * 100).toFixed(0) + '%';
  ammoText.textContent = `AMMO ${survival.ammo}/${survival.maxAmmo}`;
  resText.textContent  = `🪵 ${survival.wood}  🪨 ${survival.stone}  🍖 ${survival.food}`;
  survivalHud.classList.toggle('on', survival.on);
}
function updateSurvivalBtn() {
  survivalBtn.textContent = '💀 Survival Mode: ' + (survival.on ? 'ON' : 'OFF');
  survivalBtn.classList.toggle('on', survival.on);
}
function updateCarBtn() {
  carBtn.textContent = car.driving ? '🚗 Exit Car  (E)' : '🚗 Enter Car  (E)';
  carBtn.classList.toggle('on', car.driving);
}

/* crosshair */
const crosshair = document.createElement('div');
crosshair.id = 'crosshair';
crosshair.style.cssText = `
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  width:22px;height:22px;pointer-events:none;z-index:13;display:none;
`;
crosshair.innerHTML = `
  <svg width="22" height="22" viewBox="0 0 22 22" xmlns="http://www.w3.org/2000/svg">
    <line x1="11" y1="2"  x2="11" y2="8"  stroke="#e8ff8a" stroke-width="2" stroke-linecap="round"/>
    <line x1="11" y1="14" x2="11" y2="20" stroke="#e8ff8a" stroke-width="2" stroke-linecap="round"/>
    <line x1="2"  y1="11" x2="8"  y2="11" stroke="#e8ff8a" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="11" x2="20" y2="11" stroke="#e8ff8a" stroke-width="2" stroke-linecap="round"/>
    <circle cx="11" cy="11" r="1.3" fill="#e8ff8a"/>
  </svg>
  <div id="muzzle-flash" style="
    position:absolute;inset:-14px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,230,140,.85),transparent 65%);
    opacity:0;transition:opacity .07s;pointer-events:none"></div>
  <div id="hit-marker" style="
    position:absolute;inset:-8px;color:#ff5a5a;font:bold 20px monospace;
    line-height:38px;text-align:center;opacity:0;transition:opacity .12s;pointer-events:none">✕</div>
`;
document.body.appendChild(crosshair);
const muzzleFlashEl = crosshair.querySelector('#muzzle-flash');
const hitMarkerEl   = crosshair.querySelector('#hit-marker');

survivalBtn.addEventListener('click', () => {
  survival.on = !survival.on;
  if (!survival.on) {
    enemies.length = 0;
  } else {
    enemySpawnTimer = 1.0;
    ensureAudio();
    if (flightMode) {
      flightMode = false;
      velocityY = 0;
      updateFlyLabel();
      const flyBtn = $('btn-fly');
      if (flyBtn) flyBtn.classList.remove('on');
    }
  }
  crosshair.style.display = survival.on ? 'block' : 'none';
  updateSurvivalBtn();
  updateSurvivalHud();
});

carBtn.addEventListener('click', () => { tryToggleCar(); });
$('respawn-btn').addEventListener('click', () => { respawnPlayer(); });

addEventListener('keydown', e => {
  if (e.key === 'e' || e.key === 'E') { tryToggleCar(); }
  if (e.key === 'k' || e.key === 'K') { shoot(); }
});

document.addEventListener('mousedown', e => {
  if (e.target !== canvas && document.pointerLockElement !== canvas) return;
  if (!survival.on || e.button !== 0) return;
  e.stopPropagation();
  e.preventDefault();
  shoot();
}, true);

$('btn-shoot')?.addEventListener('pointerdown', e => {
  e.preventDefault(); e.stopPropagation(); shoot();
});
$('btn-car')?.addEventListener('pointerdown', e => {
  e.preventDefault(); e.stopPropagation(); tryToggleCar();
});

/* ══════════════════════════════════════════════════════════
   10 · FUNCTION HOOKS
   ══════════════════════════════════════════════════════════ */
const _handleKeyInput = handleKeyInput;
handleKeyInput = function () {
  if (car.driving) return;
  _handleKeyInput();
};

addEventListener('keydown', e => {
  if (survival.on && (e.key === 'f' || e.key === 'F')) {
    if (flightMode) {
      flightMode = false; velocityY = 0; updateFlyLabel();
      const flyBtn = $('btn-fly');
      if (flyBtn) flyBtn.classList.remove('on');
    }
    e.preventDefault();
  }
}, true);

const _applyGravity = applyGravity;
applyGravity = function (dt) {
  if (survival.on && flightMode) {
    flightMode = false; velocityY = 0; updateFlyLabel();
    const flyBtn = $('btn-fly');
    if (flyBtn) flyBtn.classList.remove('on');
  }
  if (car.driving) return;
  _applyGravity(dt);
};

const _updateAtmosphere = updateAtmosphere;
updateAtmosphere = function (dt) {
  updateDayNight(dt);
  _updateAtmosphere(dt);
  applyNightTint();
};

const _drawMobs = drawMobs;
drawMobs = function () {
  _drawMobs();
  drawExtras();
};

const SURVIVAL_MAX_EDITS = 6;
const _applyTerrainEdit = applyTerrainEdit;
applyTerrainEdit = function (dig) {
  if (survival.on) {
    if (edits.length >= SURVIVAL_MAX_EDITS) edits.shift();
    const x = position[0] + Math.sin(mouseX) * 10;
    const z = position[2] - Math.cos(mouseX) * 10;
    edits.push([x, z, 14, dig ? -3 : 3]);
    scheduleWorldBroadcast();
    rebuildTreeInstances(true);
    rebuildStructures(true);
    return;
  }
  _applyTerrainEdit(dig);
  rebuildStructures(true);
};

addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') {
    car.y = cachedHeightAt(car.x, car.z) + 0.5;
    car.netY = car.y;
    rebuildStructures(true);
  }
});

/* ══════════════════════════════════════════════════════════
   11 · MAIN LOOP WRAP
   ══════════════════════════════════════════════════════════ */
let _lastExtFrame = performance.now();
const _animate = animate;
animate = function () {
  const now = performance.now();
  const dt = Math.min((now - _lastExtFrame) / 1000, 0.05);
  _lastExtFrame = now;

  updateCar(dt);
  updateSurvival(dt);
  rebuildStructures(false);
  updateStructures(dt);

  sendCarState(false);
  sendEnemyState();

  if (muzzleFlashT > 0) {
    muzzleFlashT -= dt;
    muzzleFlashEl.style.opacity = Math.max(0, muzzleFlashT / 0.09);
  } else muzzleFlashEl.style.opacity = 0;

  if (hitMarkerT > 0) {
    hitMarkerT -= dt;
    hitMarkerEl.style.opacity = Math.max(0, hitMarkerT / 0.12);
  } else hitMarkerEl.style.opacity = 0;

  if ((animate._c = ((animate._c || 0) + 1) % 6) === 0) {
    updateSurvivalHud();
    if (car.driving) carPrompt.classList.remove('on');
    else {
      const dx = targetPosition[0] - car.x, dz = targetPosition[2] - car.z;
      const near = dx*dx + dz*dz < 36 && (!car.driverId || car.driverId === ID);
      carPrompt.classList.toggle('on', near);
    }
    updateCarBtn();
  }

  _animate();
};

updateSurvivalHud();
updateSurvivalBtn();
updateCarBtn();

/* time-of-day indicator */
const dnIndicator = document.createElement('div');
dnIndicator.id = 'timeofday';
document.body.appendChild(dnIndicator);
setInterval(() => {
  const h = Math.floor(dayNight.time * 24);
  const m = Math.floor((dayNight.time * 24 - h) * 60);
  dnIndicator.textContent =
    (dayNight.isNight ? '🌙' : '☀️') + ' ' +
    String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}, 500);

console.log('%c✔ Full game loaded: FAST WALK · guns · day/night · CREEPERS · HOUSES · no-fly-in-survival · screams',
            'color:#4f8;font-weight:bold');
})();
