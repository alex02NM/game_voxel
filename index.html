const audioCache={};
function loadAudio(url){
  if(audioCache[url])return audioCache[url];
  const a=new Audio(url);
  a.preload='auto';
  a.crossOrigin='anonymous';
  audioCache[url]=a;
  return a;
}
function playRealSound(key, volume=1, loop=false, fadeIn=0){
  const url=AUDIO_SOURCES[key];
  if(!url)return null;
  const a=loadAudio(url);
  if(!a)return null;
  try{
    a.loop=loop;
    a.volume=Math.max(0,Math.min(1,volume*sfxVolume*2.5));
    if(fadeIn>0){
      a.volume=0;
      a.currentTime=0;
      a.play().catch(()=>{});
      const start=performance.now();
      const f=()=>{
        const t=(performance.now()-start)/1000;
        if(t>=fadeIn){a.volume=Math.max(0,Math.min(1,volume*sfxVolume*2.5));return;}
        a.volume=Math.max(0,Math.min(1,volume*sfxVolume*2.5))*(t/fadeIn);
        requestAnimationFrame(f);
      };
      requestAnimationFrame(f);
    } else {
      a.currentTime=0;
      a.play().catch(()=>{});
    }
  }catch(e){}
  return a;
}
function stopRealSound(key){
  const url=AUDIO_SOURCES[key];
  if(!url)return;
  const a=audioCache[url];
  if(a){try{a.pause();a.currentTime=0;}catch(e){}}
}

let forestAmbientHandle=null;
function startForestAmbient(){
  if(forestAmbientHandle)return;

}
function stopForestAmbient(){
  if(forestAmbientHandle){
    try{forestAmbientHandle.pause();forestAmbientHandle.currentTime=0;}catch(e){}

}

function updateSanity(dt){

  let minZ=Infinity;

    if(m.type!=='zombie')continue;
    if(m.isGhost)continue;
    const d=Math.hypot(m.x-targetPosition[0],m.z-targetPosition[2]);

  }
  if(minZ<18)rate+=(1-minZ/18)*0.09;
  if(player.hp<30&&gameStarted)rate+=0.05;
  if(inSafeZone(targetPosition[0],targetPosition[2]))rate-=0.35;

function updateDanger(dt){

    const bd=Math.hypot(activeBoss.x-targetPosition[0],activeBoss.z-targetPosition[2]);

function updateHorrorAmbience(dt){

  }

    }

}

hintEl.querySelector('.fs-hint-close').addEventListener('click',()=>{hintEl.style.display='none';sessionStorage.setItem(HINT_KEY,'1');});
setTimeout(()=>{if(hintEl)hintEl.style.display='none';},12000);}
if(isTouchDevice){let armed=true;const armFs=()=>{if(!armed)return;armed=false;
for(const ev of['pointerdown','touchstart','click'])document.removeEventListener(ev,armFs);
if(isStandalone||fsElement()||pseudoFullscreen)return;requestFs().catch(()=>{});if(isIPhone&&!isStandalone)setTimeout(()=>showIOSHint(false),900);};
for(const ev of['pointerdown','touchstart','click'])document.addEventListener(ev,armFs,{once:true,passive:true});}
const fsBtn=document.getElementById('fs-btn'),fsFab=document.createElement('button');fsFab.id='fs-fab';fsFab.textContent='⛶';fsFab.addEventListener('click',toggleFs);document.body.appendChild(fsFab);
function updateFsBtn(){const on=fsActive();fsBtn.textContent=on?'⛶ Fullscreen: ON':'⛶ Fullscreen: OFF';fsBtn.classList.toggle('on',on);fsFab.style.display=(isTouchDevice&&!on)?'flex':'none';}
fsBtn.addEventListener('click',toggleFs);
for(const ev of['fullscreenchange','webkitfullscreenchange'])document.addEventListener(ev,()=>{updateFsBtn();setTimeout(resizeViewport,120);});
updateFsBtn();
const joyBase=document.getElementById('joystick'),joyKnob=document.getElementById('stick'),JOY_MAX=50,JOY_DEADZONE=.14;
let joyPointerId=null,joyCenterX=0,joyCenterY=0;
function joyApply(cx,cy){const dx=cx-joyCenterX,dy=cy-joyCenterY,len=Math.hypot(dx,dy),clamped=Math.min(len,JOY_MAX),nx=len>1e-4?dx/len:0,ny=len>1e-4?dy/len:0;
joyKnob.style.transform=`translate(${(nx*clamped).toFixed(1)}px, ${(ny*clamped).toFixed(1)}px)`;
let vx=nx*clamped/JOY_MAX,vy=ny*clamped/JOY_MAX;if(Math.hypot(vx,vy)<JOY_DEADZONE){vx=0;vy=0;}joyVec.x=vx;joyVec.y=vy;}
function joyReset(){joyPointerId=null;joyVec.x=joyVec.y=0;joyKnob.style.transform='translate(0px, 0px)';}
joyBase.addEventListener('pointerdown',e=>{if(joyPointerId!==null)return;const r=joyBase.getBoundingClientRect();
joyCenterX=r.left+r.width*.5;joyCenterY=r.top+r.height*.5;joyPointerId=e.pointerId;
try{joyBase.setPointerCapture(e.pointerId);}catch{}joyApply(e.clientX,e.clientY);e.preventDefault();});
joyBase.addEventListener('pointermove',e=>{if(e.pointerId!==joyPointerId)return;joyApply(e.clientX,e.clientY);e.preventDefault();});
for(const ev of['pointerup','pointercancel','lostpointercapture'])joyBase.addEventListener(ev,e=>{if(e.pointerId===joyPointerId)joyReset();});
function bindHold(id,key){const el=document.getElementById(id);if(!el)return;
const down=e=>{e.preventDefault();keysPressed[key]=true;el.classList.add('active');};
const up=()=>{keysPressed[key]=false;el.classList.remove('active');};
el.addEventListener('pointerdown',down);
for(const ev of['pointerup','pointercancel','pointerleave','lostpointercapture'])el.addEventListener(ev,up);}
function bindTap(id,fn){const el=document.getElementById(id);if(!el)return;
el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('active');setTimeout(()=>el.classList.remove('active'),120);fn();});}
bindHold('btn-jump',' ');bindHold('btn-down','Shift');
bindTap('btn-mode',()=>{if(editLocked)return;modeIndex=(modeIndex+1)%3;updateModeLabel();scheduleWorldBroadcast();rebuildTreeInstances(true);});
bindTap('btn-reset',()=>{if(editLocked)return;edits.length=0;scheduleWorldBroadcast();rebuildTreeInstances(true);});
bindTap('btn-raise',()=>applyTerrainEdit(false));bindTap('btn-dig',()=>applyTerrainEdit(true));
const flyBtn=document.getElementById('btn-fly');const updateFlyBtn=()=>flyBtn.classList.toggle('on',flightMode);
flyBtn.addEventListener('pointerdown',e=>{e.preventDefault();if(editLocked)return;flightMode=!flightMode;if(flightMode)velocityY=0;updateFlyLabel();updateFlyBtn();});updateFlyBtn();
const sprintBtn=document.getElementById('btn-sprint');const updateSprintBtn=()=>sprintBtn.classList.toggle('on',sprinting);
sprintBtn.addEventListener('pointerdown',e=>{e.preventDefault();sprinting=!sprinting;updateSprintBtn();});updateSprintBtn();
const controlsEl=document.getElementById('touch-controls'),touchBtn=document.getElementById('touch-btn');
function setTouchControls(on){controlsEl.classList.toggle('enabled',on);touchBtn.textContent='🎮 Touch Controls: '+(on?'ON':'OFF');touchBtn.classList.toggle('on',on);
if(!on){joyVec.x=joyVec.y=0;joyKnob.style.transform='translate(0px, 0px)';keysPressed[' ']=false;keysPressed['Shift']=false;sprinting=false;updateSprintBtn();}}
touchBtn.addEventListener('click',()=>setTouchControls(!controlsEl.classList.contains('enabled')));setTouchControls(isTouchDevice);
const treesBtn=document.getElementById('trees-btn');
function updateTreesBtn(){treesBtn.textContent='🌲 Trees: '+(treesEnabled?'ON':'OFF');treesBtn.classList.toggle('on',treesEnabled);}
treesBtn.addEventListener('click',()=>{treesEnabled=!treesEnabled;updateTreesBtn();rebuildTreeInstances(true);scheduleWorldBroadcast();});updateTreesBtn();
const shadowsBtn=document.getElementById('shadows-btn');
function updateShadowsBtn(){shadowsBtn.textContent='🌑 Soft Shadows: '+(shadowsEnabled?'ON':'OFF');shadowsBtn.classList.toggle('on',shadowsEnabled);}
shadowsBtn.addEventListener('click',()=>{shadowsEnabled=!shadowsEnabled;updateShadowsBtn();});
if(isTouchDevice)shadowsEnabled=false;updateShadowsBtn();
const treeHSlider=document.getElementById('tree_h'),treeHLabel=document.getElementById('tree_h_val'),treeDSlider=document.getElementById('tree_d'),treeDLabel=document.getElementById('tree_d_val');
treeHSlider.value=TREE_HEIGHT_MULT;treeHLabel.textContent=TREE_HEIGHT_MULT.toFixed(2)+'×';
treeDSlider.value=TREE_DENSITY_MULT;treeDLabel.textContent=TREE_DENSITY_MULT.toFixed(2)+'×';
treeHSlider.addEventListener('input',()=>{if(editLocked)return;TREE_HEIGHT_MULT=parseFloat(treeHSlider.value);treeHLabel.textContent=TREE_HEIGHT_MULT.toFixed(2)+'×';rebuildTreeInstances(true);scheduleWorldBroadcast();});
treeDSlider.addEventListener('input',()=>{if(editLocked)return;TREE_DENSITY_MULT=parseFloat(treeDSlider.value);treeDLabel.textContent=TREE_DENSITY_MULT.toFixed(2)+'×';rebuildTreeInstances(true);scheduleWorldBroadcast();});
document.getElementById('rainforest-btn').addEventListener('click',()=>{if(editLocked)return;
TREE_HEIGHT_MULT=2.2;TREE_DENSITY_MULT=2.4;treeHSlider.value=TREE_HEIGHT_MULT;treeHLabel.textContent=TREE_HEIGHT_MULT.toFixed(2)+'×';
treeDSlider.value=TREE_DENSITY_MULT;treeDLabel.textContent=TREE_DENSITY_MULT.toFixed(2)+'×';rebuildTreeInstances(true);scheduleWorldBroadcast();});
const panel=document.getElementById('params');panel.querySelector('h3').addEventListener('click',()=>panel.classList.toggle('collapsed'));})();
</script>
</body></html>
