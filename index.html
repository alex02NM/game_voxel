/* ══════════════════════════════════════════════════════════
   1 · SOUND EFFECTS
   ══════════════════════════════════════════════════════════ */
const sfx = { master:null, ready:false, screamBus:null };

function ensureAudio() {
  try {
    if (!music.ctx) initAudio();
    if (!music.ctx) return false;
    if (music.ctx.state === 'suspended') music.ctx.resume();
    if (!sfx.ready) {
      sfx.master = music.ctx.createGain();
      sfx.master.gain.value = 0.55;
      sfx.master.connect(music.ctx.destination);
      const conv = music.ctx.createConvolver();
      conv.buffer = makeImpulseResponse(music.ctx, 3.2, 2.2);
      sfx.screamBus = music.ctx.createGain();
      sfx.screamBus.gain.value = 0.42;
      sfx.screamBus.connect(conv);
      conv.connect(sfx.master);
      sfx.ready = true;
    }
    return true;
  } catch (e) { return false; }
}

function noiseBurst(ctx, dur, decayPow, filterType, freq, q) {
  const n = Math.max(64, Math.floor(ctx.sampleRate * dur));
  const buf = ctx.createBuffer(1, n, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, decayPow);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const f = ctx.createBiquadFilter();
  f.type = filterType || 'bandpass';
  f.frequency.value = freq || 900;
  f.Q.value = q || 0.8;
  src.connect(f);
  return { src, filter: f };
}

function playSfx(kind) {
  if (!ensureAudio()) return;
  const ctx = music.ctx, t = ctx.currentTime;
  try {
    if (kind === 'gunshot') {
      const burst = noiseBurst(ctx, 0.22, 3, 'bandpass', 1100, 0.7);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.6, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      burst.filter.connect(g); g.connect(sfx.master);
      burst.src.start(t); burst.src.stop(t + 0.24);
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(160, t);
      o.frequency.exponentialRampToValueAtTime(42, t + 0.16);
      const og = ctx.createGain();
      og.gain.setValueAtTime(0.4, t);
      og.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      o.connect(og); og.connect(sfx.master); o.start(t); o.stop(t + 0.2);
      return;
    }
    if (kind === 'zombie') {
      const o = ctx.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(90 + Math.random()*30, t);
      o.frequency.exponentialRampToValueAtTime(45, t + 1.1);
      const wob = ctx.createOscillator(); wob.frequency.value = 8 + Math.random()*6;
      const wg = ctx.createGain(); wg.gain.value = 12;
      wob.connect(wg); wg.connect(o.frequency);
      const f = ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 1100;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.24, t + 0.15);
      g.gain.exponentialRampToValueAtTime(0.001, t + 1.25);
      o.connect(f); f.connect(g);
      g.connect(sfx.master); g.connect(sfx.screamBus);
      o.start(t); wob.start(t); o.stop(t + 1.3); wob.stop(t + 1.3);
      return;
    }
    if (kind === 'skeleton') {
      const o = ctx.createOscillator(); o.type = 'square';
      o.frequency.setValueAtTime(420 + Math.random()*90, t);
      o.frequency.exponentialRampToValueAtTime(180, t + 0.75);
      const f = ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value = 500;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.14, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.85);
      o.connect(f); f.connect(g);
      g.connect(sfx.master); g.connect(sfx.screamBus);
      o.start(t); o.stop(t + 0.95);
      const burst = noiseBurst(ctx, 0.4, 5, 'highpass', 2400, 1.1);
      const bg = ctx.createGain(); bg.gain.value = 0.24;
      burst.filter.connect(bg); bg.connect(sfx.master);
      burst.src.start(t); burst.src.stop(t + 0.45);
      return;
    }
    if (kind === 'brute') {
      const o = ctx.createOscillator(); o.type='sawtooth';
      o.frequency.setValueAtTime(48, t);
      o.frequency.exponentialRampToValueAtTime(26, t + 1.6);
      const f = ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 700;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.42, t + 0.2);
      g.gain.exponentialRampToValueAtTime(0.001, t + 1.9);
      o.connect(f); f.connect(g);
      g.connect(sfx.master); g.connect(sfx.screamBus);
      o.start(t); o.stop(t + 2.0);
      return;
    }
    if (kind === 'boss_roar') {
      for (let v = 0; v < 4; v++) {
        const o = ctx.createOscillator();
        o.type = v % 2 ? 'square' : 'sawtooth';
        const base = 28 + v * 8 + Math.random() * 6;
        o.frequency.setValueAtTime(base, t);
        o.frequency.linearRampToValueAtTime(base * 1.6, t + 0.5);
        o.frequency.exponentialRampToValueAtTime(base * 0.6, t + 2.4);
        const f = ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 400;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.5, t + 0.25);
        g.gain.linearRampToValueAtTime(0.42, t + 1.6);
        g.gain.exponentialRampToValueAtTime(0.001, t + 2.8);
        o.connect(f); f.connect(g);
        g.connect(sfx.master); g.connect(sfx.screamBus);
        o.start(t); o.stop(t + 3.0);
      }
      const burst = noiseBurst(ctx, 2.6, 1.0, 'lowpass', 300, 1.0);
      const bg = ctx.createGain();
      bg.gain.setValueAtTime(0, t);
      bg.gain.linearRampToValueAtTime(0.5, t + 0.3);
      bg.gain.exponentialRampToValueAtTime(0.001, t + 2.6);
      burst.filter.connect(bg); bg.connect(sfx.master); bg.connect(sfx.screamBus);
      burst.src.start(t); burst.src.stop(t + 2.8);
      return;
    }
    if (kind === 'spider') {
      for (let i = 0; i < 8; i++) {
        const o = ctx.createOscillator(); o.type='triangle';
        const base = 1400 + Math.random()*900;
        o.frequency.setValueAtTime(base, t + i*0.045);
        o.frequency.exponentialRampToValueAtTime(base*0.6, t + i*0.045 + 0.06);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.09, t + i*0.045);
        g.gain.exponentialRampToValueAtTime(0.001, t + i*0.045 + 0.09);
        o.connect(g); g.connect(sfx.master);
        o.start(t + i*0.045); o.stop(t + i*0.045 + 0.1);
      }
      return;
    }
    if (kind === 'creeper_fuse') {
      const burst = noiseBurst(ctx, 1.6, 0.4, 'highpass', 1800, 0.6);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.05, t);
      g.gain.linearRampToValueAtTime(0.32, t + 1.4);
      const p = ctx.createOscillator(); p.type='sawtooth';
      p.frequency.setValueAtTime(220, t);
      p.frequency.linearRampToValueAtTime(720, t + 1.4);
      const pg = ctx.createGain(); pg.gain.value = 0.06;
      p.connect(pg); pg.connect(g);
      burst.filter.connect(g); g.connect(sfx.master);
      burst.src.start(t); burst.src.stop(t + 1.7);
      p.start(t); p.stop(t + 1.7);
      return;
    }
    if (kind === 'creeper_boom') {
      const burst = noiseBurst(ctx, 1.0, 1.8, 'lowpass', 380, 0.9);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.75, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.85);
      burst.filter.connect(g); g.connect(sfx.master);
      burst.src.start(t); burst.src.stop(t + 0.95);
      const o = ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(140, t);
      o.frequency.exponentialRampToValueAtTime(28, t + 0.7);
      const og = ctx.createGain();
      og.gain.setValueAtTime(0.55, t);
      og.gain.exponentialRampToValueAtTime(0.001, t + 0.75);
      o.connect(og); og.connect(sfx.master);
      o.start(t); o.stop(t + 0.8);
      return;
    }
    if (kind === 'hit') {
      const o = ctx.createOscillator(); o.type='triangle';
      o.frequency.setValueAtTime(900, t);
      o.frequency.exponentialRampToValueAtTime(220, t + 0.14);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.22, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
      o.connect(g); g.connect(sfx.master); o.start(t); o.stop(t + 0.18);
      return;
    }
    if (kind === 'hurt') {
      const o = ctx.createOscillator(); o.type='square';
      o.frequency.setValueAtTime(220, t);
      o.frequency.exponentialRampToValueAtTime(65, t + 0.32);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.24, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      o.connect(g); g.connect(sfx.master); o.start(t); o.stop(t + 0.4);
      return;
    }
    if (kind === 'gather') {
      const o = ctx.createOscillator(); o.type='sine';
      o.frequency.setValueAtTime(880, t);
      o.frequency.exponentialRampToValueAtTime(1360, t + 0.12);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.17, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      o.connect(g); g.connect(sfx.master); o.start(t); o.stop(t + 0.3);
      return;
    }
    if (kind === 'scream') {
      for (let v = 0; v < 3; v++) {
        const o = ctx.createOscillator();
        o.type = v === 2 ? 'square' : 'sawtooth';
        const base = 380 + v * 90 + Math.random() * 40;
        o.frequency.setValueAtTime(base, t);
        o.frequency.linearRampToValueAtTime(base * (1.4 + Math.random()*0.4), t + 0.5);
        o.frequency.exponentialRampToValueAtTime(base * 0.42, t + 1.6);
        const f = ctx.createBiquadFilter();
        f.type='bandpass'; f.frequency.value = base * 1.2; f.Q.value = 3.2;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(0.14, t + 0.15);
        g.gain.linearRampToValueAtTime(0.12, t + 0.9);
        g.gain.exponentialRampToValueAtTime(0.001, t + 1.9);
        o.connect(f); f.connect(g);
        g.connect(sfx.master); g.connect(sfx.screamBus);
        o.start(t); o.stop(t + 2.0);
      }
      const burst = noiseBurst(ctx, 1.8, 1.4, 'bandpass', 1400, 1.2);
      const bg = ctx.createGain();
      bg.gain.setValueAtTime(0, t);
      bg.gain.linearRampToValueAtTime(0.09, t + 0.4);
      bg.gain.exponentialRampToValueAtTime(0.001, t + 1.9);
      burst.filter.connect(bg); bg.connect(sfx.master); bg.connect(sfx.screamBus);
      burst.src.start(t); burst.src.stop(t + 2.0);
      return;
    }
  } catch (e) {}
}

const engine = { osc:null, gain:null, lfo:null };
function startEngine() {
  if (!ensureAudio()) return;
  if (engine.osc) return;
  const ctx = music.ctx, t = ctx.currentTime;
  try {
    const o = ctx.createOscillator();
    o.type = 'sawtooth'; o.frequency.value = 65;
    const g = ctx.createGain(); g.gain.value = 0;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 7;
    const lg = ctx.createGain(); lg.gain.value = 5;
    lfo.connect(lg); lg.connect(o.frequency);
    const f = ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 430;
    o.connect(f); f.connect(g); g.connect(sfx.master);
    g.gain.linearRampToValueAtTime(0.10, t + 0.4);
    o.start(t); lfo.start(t);
    engine.osc = o; engine.gain = g; engine.lfo = lfo;
  } catch (e) {}
}
function stopEngine() {
  if (!engine.osc) return;
  const ctx = music.ctx, t = ctx.currentTime;
  try {
    engine.gain.gain.cancelScheduledValues(t);
    engine.gain.gain.setValueAtTime(engine.gain.gain.value, t);
    engine.gain.gain.linearRampToValueAtTime(0, t + 0.25);
    const o = engine.osc, l = engine.lfo;
    setTimeout(() => { try { o.stop(); l.stop(); } catch(e){} }, 400);
  } catch (e) {}
  engine.osc = null; engine.gain = null; engine.lfo = null;
}

/* ══════════════════════════════════════════════════════════
   2 · DAY / NIGHT
   ══════════════════════════════════════════════════════════ */
const dayNight = {
  time: 0.28, cycleSec: 200, enabled: true,
  isNight: false, nightFactor: 0, nextScream: 4
};

function updateDayNight(dt) {
  if (!dayNight.enabled) return;
  dayNight.time = (dayNight.time + dt / dayNight.cycleSec) % 1;
  const sunA = (dayNight.time - 0.25) * Math.PI * 2;
  const sy   = Math.sin(sunA);
  const sx   = Math.cos(sunA) * 0.6;
  SUN_DIR[0] = sx;
  SUN_DIR[1] = Math.max(-0.4, sy);
  SUN_DIR[2] = 0.30;
  const nf = Math.max(0, Math.min(1, 1 - (sy + 0.14) * 3));
  dayNight.nightFactor = nf;
  dayNight.isNight = nf > 0.55;
  const warm = Math.max(0, 1 - Math.abs(sy) * 2.2);
  SUN_COLOR[0] = 1.05 * (1 - nf * 0.72) + 0.18 * nf + warm * 0.15;
  SUN_COLOR[1] = 1.00 * (1 - nf * 0.72) + 0.16 * nf + warm * 0.05;
  SUN_COLOR[2] = 0.90 * (1 - nf * 0.85) + 0.30 * nf - warm * 0.10;
  if (dayNight.isNight && survival.on) {
    dayNight.nextScream -= dt;
    if (dayNight.nextScream <= 0) {
      dayNight.nextScream = 5 + Math.random() * 10;
      playSfx('scream');
    }
  }
}

function applyNightTint() {
  const nf = dayNight.nightFactor;
  if (nf <= 0.01) return;
  const nightSky  = [0.020, 0.030, 0.075];
  const nightTop  = [0.010, 0.015, 0.045];
  const nightGnd  = [0.020, 0.025, 0.040];
  for (let i = 0; i < 3; i++) {
    currentSky[i]     = currentSky[i]     * (1 - nf * 0.88) + nightSky[i] * nf * 0.88;
    currentSkyTop[i]  = currentSkyTop[i]  * (1 - nf * 0.92) + nightTop[i] * nf * 0.92;
    currentGround[i]  = currentGround[i]  * (1 - nf * 0.85) + nightGnd[i] * nf * 0.85;
  }
  gl.clearColor(...currentSky, 1);
  pushLightingAll();
}

/* ══════════════════════════════════════════════════════════
   3 · CAR
   ══════════════════════════════════════════════════════════ */
const car = {
  x: 10, y: 0, z: 10, yaw: 0.6, speed: 0,
  netX: 10, netY: 0, netZ: 10, netYaw: 0.6,
  driverId: null, driving: false
};
car.y = cachedHeightAt(car.x, car.z) + 0.5;
car.netY = car.y;

function enterCar() {
  if (car.driverId && car.driverId !== ID) return;
  car.driving  = true;
  car.driverId = ID;
  car.speed    = 0;
  flightMode   = false;
  updateFlyLabel();
  startEngine();
  scheduleWorldBroadcast();
  sendCarState(true);
  updateCarBtn();
}
function exitCar() {
  if (!car.driving) return;
  car.driving  = false;
  car.driverId = null;
  car.speed    = 0;
  stopEngine();
  const rx = Math.cos(car.yaw), rz = Math.sin(car.yaw);
  targetPosition[0] = car.x + rx * 3.2;
  targetPosition[2] = car.z + rz * 3.2;
  targetPosition[1] = cachedHeightAt(targetPosition[0], targetPosition[2]) + EYE_HEIGHT;
  velocityY = 0; grounded = true;
  scheduleWorldBroadcast();
  sendCarState(true);
  updateCarBtn();
}
function tryToggleCar() {
  if (car.driving) { exitCar(); return; }
  if (car.driverId && car.driverId !== ID) return;
  const dx = targetPosition[0] - car.x, dz = targetPosition[2] - car.z;
  if (dx*dx + dz*dz < 36) { enterCar(); return; }
  const fx = Math.sin(mouseX), fz = -Math.cos(mouseX);
  car.x = targetPosition[0] + fx * 4;
  car.z = targetPosition[2] + fz * 4;
  car.yaw = mouseX;
  car.y = cachedHeightAt(car.x, car.z) + 0.5;
  car.netX = car.x; car.netY = car.y; car.netZ = car.z; car.netYaw = car.yaw;
  enterCar();
}
function updateCar(dt) {
  if (car.driving) {
    let thr = 0, str = 0;
    if (keysPressed['w']) thr += 1;
    if (keysPressed['s']) thr -= 1;
    if (keysPressed['a']) str -= 1;
    if (keysPressed['d']) str += 1;
    thr += -joyVec.y;
    str +=  joyVec.x;
    thr = Math.max(-1, Math.min(1, thr));
    str = Math.max(-1, Math.min(1, str));
    const MAXF = 26, MAXR = -9, ACC = 16, BRK = 28, FRIC = 8;
    if (thr > 0.05)       car.speed += ACC * thr * dt;
    else if (thr < -0.05) car.speed += BRK * thr * dt;
    else {
      const s = Math.sign(car.speed);
      car.speed -= s * FRIC * dt;
      if (Math.sign(car.speed) !== s) car.speed = 0;
    }
    car.speed = Math.max(MAXR, Math.min(MAXF, car.speed));
    const sf = Math.min(1, Math.abs(car.speed) / 5);
    car.yaw += str * 1.9 * sf * dt * (car.speed < -0.5 ? -1 : 1);
    const fx = Math.sin(car.yaw), fz = -Math.cos(car.yaw);
    car.x += fx * car.speed * dt;
    car.z += fz * car.speed * dt;
    const gy = cachedHeightAt(car.x, car.z) + 0.5;
    car.y += (gy - car.y) * Math.min(1, dt * 10);
    const back = 9.0, up = 4.0;
    targetPosition[0] = car.x - fx * back;
    targetPosition[1] = car.y + up;
    targetPosition[2] = car.z - fz * back;
    mouseX = car.yaw;
    mouseY = -0.16;
    const k = Math.min(1, dt * 14);
    position[0] += (targetPosition[0] - position[0]) * k;
    position[1] += (targetPosition[1] - position[1]) * k;
    position[2] += (targetPosition[2] - position[2]) * k;
    velocityY = 0; grounded = true;
    if (engine.osc) engine.osc.frequency.value = 60 + Math.abs(car.speed) * 3.2;
  } else if (car.driverId && car.driverId !== ID) {
    car.x += (car.netX - car.x) * 0.28;
    car.y += (car.netY - car.y) * 0.28;
    car.z += (car.netZ - car.z) * 0.28;
    let d = car.netYaw - car.yaw;
    while (d >  Math.PI) d -= Math.PI*2;
    while (d < -Math.PI) d += Math.PI*2;
    car.yaw += d * 0.28;
  } else {
    const gy = cachedHeightAt(car.x, car.z) + 0.5;
    car.y += (gy - car.y) * Math.min(1, dt * 6);
  }
}

/* ══════════════════════════════════════════════════════════
   4 · SURVIVAL STATE + TIMER + LOCK
   ══════════════════════════════════════════════════════════ */
const survival = {
  on: false, hp: 100, maxHp: 100,
  ammo: 6, maxAmmo: 6, recharge: 1.4,
  wood: 0, stone: 0, food: 0, hitCd: 0,
  locked: false           // <-- once true, cannot turn off
};

const timer = {
  running: false,
  count: 0,               // counts DOWN 5..4..3..2..1..SURVIVE
  phase: 'idle'           // 'idle' | 'countdown' | 'active'
};

function startSurvivalCountdown() {
  if (timer.running || survival.locked) return;
  survival.on = true;             // start spawning immediately
  timer.running = true;
  timer.phase = 'countdown';
  timer.count = 5;
  crosshair.style.display = 'block';
  gunEl.style.display = 'block';
  gunFlash.style.display = 'block';
  showTimer('5', '#ff5555');
  timerSub.style.display = 'block';
  timerSub.textContent = 'GET READY';
  updateSurvivalBtn();
  updateSurvivalHud();
  ensureAudio();
  playSfx('scream');

  const iv = setInterval(() => {
    timer.count -= 1;
    if (timer.count > 0) {
      showTimer(String(timer.count), '#ff5555');
      playSfx('hit');
    } else {
      clearInterval(iv);
      timer.phase = 'active';
      survival.locked = true;      // <-- LOCK: cannot turn off again
      showTimer('SURVIVE!', '#ff0000');
      timerSub.textContent = 'SURVIVAL MODE LOCKED';
      playSfx('boss_roar');
      redFlash.style.opacity = '1';
      setTimeout(() => { redFlash.style.opacity = '0'; }, 500);
      survivalBtn.disabled = true;
      survivalBtn.style.opacity = '0.45';
      survivalBtn.style.cursor = 'not-allowed';
      updateSurvivalBtn();
      setTimeout(() => {
        timerOverlay.style.display = 'none';
        timerSub.style.display = 'none';
      }, 1400);
    }
  }, 1000);
}

function showTimer(text, color) {
  timerOverlay.textContent = text;
  timerOverlay.style.color = color || '#ff2222';
  timerOverlay.style.display = 'block';
}

/* ══════════════════════════════════════════════════════════
   5 · ENEMIES + BOSS
   ══════════════════════════════════════════════════════════ */
const enemies = [];
const MAX_ENEMIES_DAY   = 18;
const MAX_ENEMIES_NIGHT = 100;
const MAX_ENEMIES_BOSS  = 10;   // extra slot for boss(es)

const ENEMY_DEF = {
  zombie:   { hp:34, speed:2.1,  radius:0.50, color:[0.34,0.62,0.36], dmg:8,  snd:'zombie',   nightBias:3 },
  skeleton: { hp:22, speed:3.0,  radius:0.45, color:[0.90,0.90,0.84], dmg:6,  snd:'skeleton', nightBias:2 },
  brute:    { hp:95, speed:1.45, radius:0.85, color:[0.56,0.22,0.22], dmg:18, snd:'brute',    nightBias:1 },
  spider:   { hp:14, speed:4.2,  radius:0.42, color:[0.14,0.10,0.16], dmg:4,  snd:'spider',   nightBias:3 },
  creeper:  { hp:18, speed:2.4,  radius:0.55, color:[0.30,0.72,0.28], dmg:0,  snd:'creeper_fuse', nightBias:6, explodes:true },
  boss:     { hp:500, speed:1.2, radius:2.0,  color:[0.6,0.05,0.05], dmg:40, snd:'boss_roar', nightBias:0 }
};

function pickEnemyType() {
  const night = dayNight.isNight;
  const pool = [];
  for (const k in ENEMY_DEF) {
    if (k === 'boss') continue;
    let w;
    if (k === 'creeper')      w = night ? 8 : 5;
    else if (k === 'zombie')  w = night ? 6 : 3;
    else if (k === 'skeleton')w = night ? 3 : 2;
    else if (k === 'spider')  w = night ? 3 : 1;
    else                      w = 1;
    for (let i = 0; i < w; i++) pool.push(k);
  }
  return pool[(Math.random() * pool.length) | 0];
}

let enemySpawnTimer = 0;
let bossSpawnTimer  = 25;   // first boss after 25s of night

function spawnEnemy(forceType, sizeMult) {
  const type = forceType || pickEnemyType();
  const a = Math.random() * TAU;
  const r = 22 + Math.random() * 28;
  const x = targetPosition[0] + Math.cos(a) * r;
  const z = targetPosition[2] + Math.sin(a) * r;
  const y = cachedHeightAt(x, z);
  const e = {
    type, x, y, z, yaw: 0, walkPhase: Math.random() * 6.28,
    vx: 0, vz: 0,
    hp: ENEMY_DEF[type].hp, maxHp: ENEMY_DEF[type].hp,
    netX: x, netY: y, netZ: z, netYaw: 0,
    soundTimer: 1.5 + Math.random() * 4,
    fuse: -1,
    healthBarT: 4.0            // show health bar on spawn
  };
  if (sizeMult) {
    e.maxHp = Math.floor(e.maxHp * sizeMult);
    e.hp    = e.maxHp;
  }
  enemies.push(e);
  playSfx(ENEMY_DEF[type].snd);
  return e;
}

function spawnBoss() {
  const a = Math.random() * TAU;
  const r = 30 + Math.random() * 12;
  const x = targetPosition[0] + Math.cos(a) * r;
  const z = targetPosition[2] + Math.sin(a) * r;
  const y = cachedHeightAt(x, z);
  const e = {
    type: 'boss', x, y, z, yaw: 0, walkPhase: 0,
    vx: 0, vz: 0,
    hp: ENEMY_DEF.boss.hp, maxHp: ENEMY_DEF.boss.hp,
    netX: x, netY: y, netZ: z, netYaw: 0,
    soundTimer: 1.0, fuse: -1,
    healthBarT: 12.0
  };
  enemies.push(e);
  playSfx('boss_roar');
  /* HORROR RED SCREEN — flash + sustained ambient tint */
  redFlash.style.opacity = '1';
  setTimeout(() => { redFlash.style.opacity = '0'; }, 900);
  redAmbient.style.opacity = '1';          // stays on until boss dies
  /* Screen shake */
  shakeScreen(0.9, 0.5);
  return e;
}

/* simple screen shake helper — nudges the camera target */
let shake = { amp: 0, t: 0 };
function shakeScreen(amp, dur) {
  shake.amp = amp;
  shake.t   = dur;
}

function creeperExplode(e) {
  playSfx('creeper_boom');
  const dx = targetPosition[0] - e.x, dz = targetPosition[2] - e.z;
  const d = Math.hypot(dx, dz);
  if (d < 6 && !car.driving) {
    const dmg = Math.max(6, 34 * (1 - d / 6));
    survival.hp -= dmg;
    survival.hitCd = 0.9;
    playSfx('hurt');
    if (survival.hp <= 0) respawnPlayer();
  }
  edits.push([e.x, e.z, 8, -4]);
  if (edits.length > 24) edits.shift();
  scheduleWorldBroadcast();
  rebuildTreeInstances(true);
  const i = enemies.indexOf(e);
  if (i >= 0) enemies.splice(i, 1);
  removeHealthBar(e);
  updateSurvivalHud();
}

function updateSurvival(dt) {
  if (survival.hitCd > 0) survival.hitCd -= dt;
  if (!survival.on) { if (enemies.length) enemies.forEach(removeHealthBar); enemies.length = 0; return; }

  if (survival.ammo < survival.maxAmmo) {
    survival.recharge -= dt;
    if (survival.recharge <= 0) { survival.ammo++; survival.recharge = 1.4; }
  } else survival.recharge = 1.4;

  /* Boss spawn timer — only at night */
  if (dayNight.isNight) {
    bossSpawnTimer -= dt;
    const bossCount = enemies.filter(e => e.type === 'boss').length;
    if (bossSpawnTimer <= 0 && bossCount < 2) {
      spawnBoss();
      bossSpawnTimer = 90 + Math.random() * 60;
    }
  } else {
    bossSpawnTimer = Math.max(bossSpawnTimer, 20);
  }

  /* Ambient red screen while any boss alive */
  const anyBoss = enemies.some(e => e.type === 'boss');
  if (anyBoss) redAmbient.style.opacity = '1';
  else if (redAmbient.style.opacity !== '0') redAmbient.style.opacity = '0';

  if (isMobHost) {
    const cap = dayNight.isNight ? MAX_ENEMIES_NIGHT : MAX_ENEMIES_DAY;
    enemySpawnTimer -= dt;
    if (enemySpawnTimer <= 0 && enemies.length < cap) {
      enemySpawnTimer = dayNight.isNight ? 0.30 + Math.random()*0.6 : 1.4 + Math.random()*1.8;
      spawnEnemy();
      if (Math.random() < 0.8 && enemies.length < cap) spawnEnemy();
      if (dayNight.isNight && Math.random() < 0.7 && enemies.length < cap) spawnEnemy();
      if (dayNight.isNight && Math.random() < 0.5 && enemies.length < cap) spawnEnemy();
    }
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      const def = ENEMY_DEF[e.type];
      if (e.healthBarT > 0) e.healthBarT -= dt;
      const dx = targetPosition[0] - e.x, dz = targetPosition[2] - e.z;
      let d = Math.hypot(dx, dz);
      if (d > 160) { enemies.splice(i, 1); removeHealthBar(e); continue; }
      if (d < 1e-3) d = 1e-3;
      const ux = dx/d, uz = dz/d;
      if (def.explodes) {
        if (d < 3.6) {
          if (e.fuse < 0) { e.fuse = 1.35; playSfx('creeper_fuse'); }
          e.fuse -= dt;
          if (e.fuse <= 0) { creeperExplode(e); continue; }
        } else if (e.fuse >= 0) e.fuse = -1;
      }
      const sp = d < 45 ? def.speed : def.speed * 0.32;
      e.vx += (ux * sp - e.vx) * Math.min(1, dt * 4);
      e.vz += (uz * sp - e.vz) * Math.min(1, dt * 4);
      e.x += e.vx * dt; e.z += e.vz * dt;
      const gy = cachedHeightAt(e.x, e.z);
      e.y += (gy - e.y) * Math.min(1, dt * 8);
      if (Math.abs(e.vx) + Math.abs(e.vz) > 0.15) {
        e.yaw = Math.atan2(e.vx, -e.vz);
        e.walkPhase += dt * 6;
      }
      if (!def.explodes && d < 1.3 + def.radius && survival.hitCd <= 0 && !car.driving) {
        survival.hp -= def.dmg;
        survival.hitCd = 0.9;
        playSfx('hurt');
        if (survival.hp <= 0) respawnPlayer();
      }
      e.soundTimer -= dt;
      if (e.soundTimer <= 0) {
        e.soundTimer = (dayNight.isNight ? 2.2 : 4.5) + Math.random() * 5;
        if (d < 45) playSfx(def.snd);
      }
    }
  } else {
    for (const e of enemies) {
      e.x += (e.netX - e.x) * 0.28;
      e.y += (e.netY - e.y) * 0.28;
      e.z += (e.netZ - e.z) * 0.28;
      let dy = e.netYaw - e.yaw;
      while (dy >  Math.PI) dy -= Math.PI*2;
      while (dy < -Math.PI) dy += Math.PI*2;
      e.yaw += dy * 0.28;
      e.walkPhase += dt * 5;
      if (e.healthBarT > 0) e.healthBarT -= dt;
    }
  }

  if (survival.hp < survival.maxHp) {
    survival.hp = Math.min(survival.maxHp, survival.hp + dt * (dayNight.isNight ? 0.6 : 2.2));
  }
}

/* ══════════════════════════════════════════════════════════
   6 · HEALTH BARS  (projected DOM elements)
   ══════════════════════════════════════════════════════════ */
const healthBars = new Map();
const _mvp = mat4.create();
const _p4  = new Float32Array(4);

function getHealthBar(e) {
  let b = healthBars.get(e);
  if (!b) {
    const el = document.createElement('div');
    el.style.cssText = `
      position:absolute;transform:translate(-50%,-50%);
      pointer-events:none;display:none;
    `;
    const border = document.createElement('div');
    border.style.cssText = `
      background:rgba(0,0,0,0.75);
      border:1px solid rgba(0,0,0,0.9);
      border-radius:3px;
      box-shadow:0 0 4px rgba(0,0,0,0.8);
      padding:1px;
    `;
    const fill = document.createElement('div');
    fill.style.cssText = `
      height:100%;width:100%;
      background:linear-gradient(90deg,#4f4,#8f8);
      border-radius:2px;
      transition:width .12s linear, background .25s;
    `;
    border.appendChild(fill);
    el.appendChild(border);
    healthLayer.appendChild(el);
    b = { el, border, fill };
    healthBars.set(e, b);
  }
  return b;
}
function removeHealthBar(e) {
  const b = healthBars.get(e);
  if (b) { b.el.remove(); healthBars.delete(e); }
}

function updateHealthBars() {
  mat4.multiply(_mvp, projectionMatrix, modelViewMatrix);
  const W = canvas.width, H = canvas.height;
  for (const e of enemies) {
    /* Only render bar when it should be visible */
    const showBar = (e.healthBarT > 0) || (e.hp < e.maxHp) || e.type === 'boss';
    const b = getHealthBar(e);
    if (!showBar) { b.el.style.display = 'none'; continue; }

    /* Height offset above the head */
    const headY = (e.type === 'boss' ? 8.5 : (e.type === 'brute' ? 3.6 : 2.6));
    _p4[0] = e.x;
    _p4[1] = e.y + headY;
    _p4[2] = e.z;
    _p4[3] = 1;

    /* manual mat4 * vec4 */
    const m = _mvp;
    const cx = m[0]*_p4[0] + m[4]*_p4[1] + m[8] * _p4[2] + m[12]*_p4[3];
    const cy = m[1]*_p4[0] + m[5]*_p4[1] + m[9] * _p4[2] + m[13]*_p4[3];
    const cz = m[2]*_p4[0] + m[6]*_p4[1] + m[10]*_p4[2] + m[14]*_p4[3];
    const cw = m[3]*_p4[0] + m[7]*_p4[1] + m[11]*_p4[2] + m[15]*_p4[3];

    if (cw <= 0.05) { b.el.style.display = 'none'; continue; }
    const ndcX = cx / cw;
    const ndcY = cy / cw;
    if (ndcX < -1.15 || ndcX > 1.15 || ndcY < -1.15 || ndcY > 1.15) {
      b.el.style.display = 'none';
      continue;
    }
    const sx = (ndcX * 0.5 + 0.5) * W;
    const sy = (1 - (ndcY * 0.5 + 0.5)) * H;

    /* Bar width scales with distance for nicer look */
    const dist = Math.hypot(e.x - position[0], e.y - position[1], e.z - position[2]);
    const scale = Math.max(0.25, Math.min(1.2, 40 / dist));
    const barW = Math.round((e.type === 'boss' ? 90 : 52) * scale);
    const barH = Math.round((e.type === 'boss' ? 10 : 7) * scale);

    b.el.style.display = 'block';
    b.el.style.left = sx.toFixed(1) + 'px';
    b.el.style.top  = sy.toFixed(1) + 'px';
    b.el.style.width  = barW + 'px';
    b.el.style.height = barH + 'px';

    const pct = Math.max(0, e.hp / e.maxHp);
    b.fill.style.width = (pct * 100).toFixed(0) + '%';
    if (pct > 0.6)      b.fill.style.background = 'linear-gradient(90deg,#2d2,#7f7)';
    else if (pct > 0.3) b.fill.style.background = 'linear-gradient(90deg,#f82,#fc4)';
    else                b.fill.style.background = 'linear-gradient(90deg,#d00,#f44)';
  }
  /* purge stale */
  for (const [e, b] of healthBars) {
    if (enemies.indexOf(e) === -1) { b.el.remove(); healthBars.delete(e); }
  }
}

/* ══════════════════════════════════════════════════════════
   7 · GUN  (fire + recoil animation)
   ══════════════════════════════════════════════════════════ */
let muzzleFlashT = 0;
let hitMarkerT   = 0;
let recoilT      = 0;

function fireRecoil() {
  recoilT = 0.11;
}

function updateGunVisual(dt) {
  if (recoilT > 0) {
    recoilT -= dt;
    const p = Math.max(0, recoilT / 0.11);
    /* Kick the gun back and rotate slightly */
    gunEl.style.transform = `translate(${(p*30).toFixed(1)}px, ${(p*50).toFixed(1)}px) rotate(${(-p*14).toFixed(1)}deg) scale(${1 + p*0.05})`;
    gunFlash.style.opacity = p.toFixed(2);
    crosshair.style.transform = `translate(-50%,-50%) scale(${1 + p*0.5})`;
  } else {
    if (gunEl.style.transform !== '') gunEl.style.transform = '';
    if (gunFlash.style.opacity !== '0') gunFlash.style.opacity = '0';
    if (crosshair.style.transform !== 'translate(-50%,-50%)')
      crosshair.style.transform = 'translate(-50%,-50%)';
  }
}

function shoot() {
  if (!survival.on) return;
  ensureAudio();
  if (survival.ammo <= 0) { playSfx('hit'); return; }
  survival.ammo--;
  if (survival.recharge > 1.4) survival.recharge = 1.4;
  playSfx('gunshot');
  muzzleFlashT = 0.09;
  fireRecoil();

  const cp = Math.cos(mouseY);
  const dx0 = Math.sin(mouseX) * cp;
  const dy0 = Math.sin(mouseY);
  const dz0 = -Math.cos(mouseX) * cp;
  const ox = position[0], oy = position[1], oz = position[2];
  let hitAnything = false;
  for (let pellet = 0; pellet < 4; pellet++) {
    const sx = (Math.random() - 0.5) * 0.045;
    const sy = (Math.random() - 0.5) * 0.045;
    const sz = (Math.random() - 0.5) * 0.045;
    const rl = Math.hypot(dx0 + sx, dy0 + sy, dz0 + sz);
    const rx = (dx0 + sx)/rl, ry = (dy0 + sy)/rl, rz = (dz0 + sz)/rl;
    let best = null, bestT = 70;
    for (const e of enemies) {
      const def = ENEMY_DEF[e.type];
      const ex = e.x - ox, ey = (e.y + 1.1) - oy, ez = e.z - oz;
      const t = ex*rx + ey*ry + ez*rz;
      if (t < 0.4 || t > bestT) continue;
      const px = ox + rx*t, py = oy + ry*t, pz = oz + rz*t;
      const hitR = 1.05 + def.radius * 0.9;
      const dd = Math.hypot(e.x - px, (e.y + 1.1) - py, e.z - pz);
      if (dd < hitR) { best = e; bestT = t; }
    }
    if (best) {
      best.hp -= 9 + Math.random() * 8;
      best.healthBarT = 3.0;
      hitAnything = true;
      if (best.hp <= 0) {
        const idx = enemies.indexOf(best);
        if (idx >= 0) { enemies.splice(idx, 1); removeHealthBar(best); }
        survival.food += 1;
        if (Math.random() < 0.4) survival.stone += 1;
        if (Math.random() < 0.3) survival.wood  += 1;
        if (best.type === 'boss') {
          redAmbient.style.opacity = '0';
          redFlash.style.opacity = '0.8';
          setTimeout(() => { redFlash.style.opacity = '0'; }, 700);
        }
      }
    }
  }
  if (hitAnything) { playSfx('hit'); hitMarkerT = 0.12; }
  updateSurvivalHud();
}

/* ══════════════════════════════════════════════════════════
   8 · RESPAWN
   ══════════════════════════════════════════════════════════ */
function respawnPlayer() {
  if (car.driving) exitCar();
  const gy = cachedHeightAt(0, 0) + EYE_HEIGHT;
  targetPosition = [0, gy, 0];
  position       = [0, gy, 0];
  velocityY = 0; grounded = true;
  survival.hp = survival.maxHp;
  survival.hitCd = 1.5;
  if (survival.on) {
    for (const e of enemies) removeHealthBar(e);
    enemies.length = 0;
    enemySpawnTimer = 2;
  }
  redAmbient.style.opacity = '0';
  playSfx('hit');
  updateSurvivalHud();
}

/* ══════════════════════════════════════════════════════════
   9 · STRUCTURES
   ══════════════════════════════════════════════════════════ */
const STRUCT_DEFS = [
  { name:'hut',      res:'wood',  amt:3 },
  { name:'tower',    res:'stone', amt:4 },
  { name:'crates',   res:'food',  amt:3 },
  { name:'campfire', res:'food',  amt:2 },
  { name:'ruins',    res:'stone', amt:3 },
  { name:'house',    res:'wood',  amt:5 }
];
const STRUCT_CELL   = 40;
const STRUCT_RADIUS = 230;
const structures    = [];
const gatheredAt    = new Map();
let lastStructX = 1e9, lastStructZ = 1e9;

function rebuildStructures(force) {
  const cx = targetPosition[0], cz = targetPosition[2];
  if (!force && Math.hypot(cx - lastStructX, cz - lastStructZ) < 24) return;
  lastStructX = cx; lastStructZ = cz;
  structures.length = 0;
  const R   = Math.ceil(STRUCT_RADIUS / STRUCT_CELL);
  const cix = Math.round(cx / STRUCT_CELL), ciz = Math.round(cz / STRUCT_CELL);
  const seed = (Math.floor(TERRAIN.seed * 1000) | 0) ^ 0x9e37;
  for (let dz = -R; dz <= R; dz++) {
    for (let dx = -R; dx <= R; dx++) {
      const gx = cix + dx, gz = ciz + dz;
      if (hash2(gx, gz, seed) > 0.55) continue;
      const r1 = hash2(gx + 101, gz - 203, seed);
      const r2 = hash2(gx - 307, gz + 509, seed);
      const r3 = hash2(gx + 701, gz + 907, seed);
      const r4 = hash2(gx - 1103, gz - 1301, seed);
      const px = (gx + r1) * STRUCT_CELL;
      const pz = (gz + r2) * STRUCT_CELL;
      const ddx = px - cx, ddz = pz - cz;
      if (ddx*ddx + ddz*ddz > STRUCT_RADIUS*STRUCT_RADIUS) continue;
      const y = cachedHeightAt(px, pz);
      if (y > 30) continue;
      const type  = Math.floor(r3 * STRUCT_DEFS.length) % STRUCT_DEFS.length;
      const scale = 0.9 + r4 * 0.6;
      const yaw   = hash2(gx + 211, gz - 223, seed) * TAU;
      structures.push({ x: px, y: y - 0.05, z: pz, yaw, type, scale, gx, gz });
      if (structures.length > 180) return;
    }
  }
}
function updateStructures() {
  const now = performance.now();
  for (const s of structures) {
    const dx = targetPosition[0] - s.x, dz = targetPosition[2] - s.z;
    if (dx*dx + dz*dz > 9) continue;
    const key = s.gx + '_' + s.gz;
    if (now - (gatheredAt.get(key) || 0) < 9000) continue;
    gatheredAt.set(key, now);
    const def = STRUCT_DEFS[s.type];
    survival[def.res] += def.amt;
    playSfx('gather');
    updateSurvivalHud();
    break;
  }
}

const EXTRA_BOX_CAP = 8000;
const extraData = new Float32Array(EXTRA_BOX_CAP * VERTS_PER_BOX * FLOATS_PER_VERT);
const extraVBO  = gl.createBuffer();
const extraVAO  = gl.createVertexArray();
gl.bindVertexArray(extraVAO);
gl.bindBuffer(gl.ARRAY_BUFFER, extraVBO);
gl.bufferData(gl.ARRAY_BUFFER, extraData.byteLength, gl.DYNAMIC_DRAW);
const EXTRA_STRIDE = FLOATS_PER_VERT * 4;
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, EXTRA_STRIDE, 0);
gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, EXTRA_STRIDE, 12);
gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 3, gl.FLOAT, false, EXTRA_STRIDE, 24);
gl.bindVertexArray(null);

function appendCar(out, k, c) {
  const co = Math.cos(c.yaw), si = Math.sin(c.yaw);
  const B = (ox,oy,oz,hx,hy,hz,col) =>
    pushRotBox(out, k, c.x, c.y, c.z, co, si, ox,oy,oz, hx,hy,hz, col[0],col[1],col[2]);
  const body  = [0.85, 0.16, 0.13];
  const cabin = [0.92, 0.60, 0.16];
  const wheel = [0.09, 0.09, 0.10];
  const glass = [0.55, 0.78, 0.92];
  const lamp  = [1.00, 0.95, 0.55];
  B( 0,     0.00,  0.00, 1.00, 0.32, 2.00, body);
  B( 0,     0.46,  0.15, 0.82, 0.28, 1.05, cabin);
  B( 0,     0.46, -0.52, 0.78, 0.26, 0.06, glass);
  B( 0,     0.46,  0.78, 0.78, 0.26, 0.06, glass);
  B(-0.62,  0.06, -1.96, 0.16, 0.10, 0.06, lamp);
  B( 0.62,  0.06, -1.96, 0.16, 0.10, 0.06, lamp);
  for (const [wx, wz] of [[-1.02,-1.25],[1.02,-1.25],[-1.02,1.25],[1.02,1.25]]) {
    B(wx, -0.28, wz, 0.16, 0.22, 0.36, wheel);
  }
  return k;
}

function appendEnemy(out, k, e) {
  const cos = Math.cos(e.yaw), sin = Math.sin(e.yaw);
  const swing = Math.sin(e.walkPhase) * 0.25;
  const c = ENEMY_DEF[e.type].color;
  const dark = [c[0]*0.55, c[1]*0.55, c[2]*0.55];
  const B = (ox,oy,oz,hx,hy,hz,col) =>
    pushRotBox(out, k, e.x, e.y, e.z, cos, sin, ox,oy,oz, hx,hy,hz, col[0],col[1],col[2]);

  if (e.type === 'creeper') {
    const flash = e.fuse >= 0 && Math.sin(e.fuse * 40) > 0;
    const body  = flash ? [0.95, 0.95, 0.95] : c;
    B(0, 0.90, 0, 0.42, 0.60, 0.30, body);
    B(0, 1.55, 0, 0.30, 0.26, 0.28, body);
    B(-0.16, 1.66, -0.16, 0.06, 0.06, 0.06, [0.10, 0.10, 0.10]);
    B( 0.16, 1.66, -0.16, 0.06, 0.06, 0.06, [0.10, 0.10, 0.10]);
    B(-0.26, 0.28,  swing, 0.14, 0.28, 0.14, dark);
    B( 0.26, 0.28, -swing, 0.14, 0.28, 0.14, dark);
    return k;
  }
  if (e.type === 'spider') {
    B(0, 0.55, 0, 0.55, 0.26, 0.42, c);
    B(0, 0.62, -0.55, 0.32, 0.28, 0.28, c);
    B(-0.12, 0.70, -0.72, 0.05, 0.05, 0.05, [1,0.12,0.10]);
    B( 0.12, 0.70, -0.72, 0.05, 0.05, 0.05, [1,0.12,0.10]);
    for (let i = 0; i < 4; i++) {
      const off = -0.4 + i * 0.26;
      B(-0.55, 0.35, off, 0.30, 0.05, 0.05, dark);
      B( 0.55, 0.35, off, 0.30, 0.05, 0.05, dark);
    }
    return k;
  }
  const scale = e.type === 'brute' ? 1.4 : (e.type === 'boss' ? 3.5 : 1.0);
  B(-0.15*scale, 0.34*scale,  swing, 0.13*scale, 0.34*scale, 0.13*scale, dark);
  B( 0.15*scale, 0.34*scale, -swing, 0.13*scale, 0.34*scale, 0.13*scale, dark);
  B( 0.00, 1.10*scale, 0.00, 0.30*scale, 0.44*scale, 0.17*scale, c);
  B(-0.38*scale, 1.25*scale, -0.30*scale, 0.10*scale, 0.10*scale, 0.38*scale, c);
  B( 0.38*scale, 1.25*scale, -0.30*scale, 0.10*scale, 0.10*scale, 0.38*scale, c);
  B( 0.00, 1.75*scale, 0.00, 0.26*scale, 0.26*scale, 0.26*scale, c);
  B(-0.08*scale, 1.80*scale, -0.24*scale, 0.045*scale, 0.045*scale, 0.045*scale, [1.0, 0.15, 0.10]);
  B( 0.08*scale, 1.80*scale, -0.24*scale, 0.045*scale, 0.045*scale, 0.045*scale, [1.0, 0.15, 0.10]);
  return k;
}

function appendStructure(out, k, s) {
  const c = Math.cos(s.yaw), sn = Math.sin(s.yaw), sc = s.scale;
  const B = (ox,oy,oz,hx,hy,hz,col) =>
    pushRotBox(out, k, s.x, s.y, s.z, c, sn,
               ox*sc, oy*sc, oz*sc, hx*sc, hy*sc, hz*sc,
               col[0], col[1], col[2]);
  const wood  = [0.55, 0.35, 0.18];
  const woodD = [0.35, 0.22, 0.10];
  const stone = [0.55, 0.55, 0.58];
  const stoneD= [0.36, 0.36, 0.39];
  const roof  = [0.62, 0.24, 0.14];
  const fire  = [1.00, 0.60, 0.15];
  const flame = [1.00, 0.88, 0.35];
  const crate = [0.66, 0.44, 0.20];
  const door  = [0.30, 0.20, 0.10];
  const glass = [0.55, 0.78, 0.92];

  const t = s.type;
  if (t === 0) {
    B(0, 0.05, 0, 0.62, 0.05, 0.62, woodD);
    B(-0.55, 0.32,  0.00, 0.06, 0.30, 0.60, wood);
    B( 0.55, 0.32,  0.00, 0.06, 0.30, 0.60, wood);
    B( 0.00, 0.32, -0.55, 0.60, 0.30, 0.06, wood);
    B(-0.30, 0.32,  0.55, 0.24, 0.30, 0.06, wood);
    B( 0.30, 0.32,  0.55, 0.24, 0.30, 0.06, wood);
    B(0, 0.62, 0, 0.65, 0.05, 0.65, roof);
    B(0, 0.72, 0, 0.55, 0.06, 0.55, roof);
    B(0, 0.82, 0, 0.40, 0.06, 0.40, roof);
  } else if (t === 1) {
    for (let i = 0; i < 8; i++) {
      const w = 0.48 - i * 0.025;
      B(0, 0.09 + i*0.11, 0, w, 0.06, w, i % 2 ? stone : stoneD);
    }
    B(0, 0.98, 0, 0.55, 0.06, 0.55, stone);
    for (let i = 0; i < 4; i++) {
      const a = i / 4 * TAU + 0.4;
      B(Math.cos(a)*0.42, 1.10, Math.sin(a)*0.42, 0.11, 0.11, 0.11, stone);
    }
  } else if (t === 2) {
    const r = mulberry32((s.gx * 73856093) ^ (s.gz * 19349663));
    for (let i = 0; i < 8; i++) {
      const x = (r() - 0.5) * 0.7, z = (r() - 0.5) * 0.7;
      const y = 0.12 + Math.floor(i / 3) * 0.22;
      B(x, y, z, 0.16, 0.11, 0.16, crate);
    }
  } else if (t === 3) {
    B(0, 0.03, 0, 0.42, 0.03, 0.42, [0.28, 0.20, 0.12]);
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * TAU;
      B(Math.cos(a)*0.13, 0.08, Math.sin(a)*0.13, 0.07, 0.06, 0.07, fire);
    }
    B(0, 0.18, 0, 0.09, 0.15, 0.09, flame);
  } else if (t === 4) {
    const r = mulberry32((s.gx * 83492791) ^ (s.gz * 29874321));
    for (let i = 0; i < 9; i++) {
      const a  = i / 9 * TAU + r() * 0.6;
      const rr = 0.35 + r() * 0.25;
      const hh = 0.15 + r() * 0.42;
      B(Math.cos(a)*rr, hh, Math.sin(a)*rr, 0.11, hh, 0.11, i % 2 ? stone : stoneD);
    }
    B(0.55, 0.09, 0.15, 0.32, 0.09, 0.09, stone);
  } else {
    const W = 0.95, H = 0.85, D = 0.95, wallT = 0.09;
    B(0, 0.04, 0, W+0.14, 0.04, D+0.14, woodD);
    B(0, H/2 + 0.06, -D, W, H/2, wallT, wood);
    B(0, H/2 + 0.06,  D, W, H/2, wallT, wood);
    B(-W, H/2 + 0.06, 0, wallT, H/2, D, wood);
    B( W, H/2 + 0.06, 0, wallT, H/2, D, wood);
    B(-0.55, 0.55, D + 0.01, 0.22, 0.22, 0.02, glass);
    B( 0.55, 0.55, D + 0.01, 0.22, 0.22, 0.02, glass);
    B(0, 0.32, D + 0.02, 0.20, 0.28, 0.03, door);
    B(-W+0.05, H/2 + 0.06, -D+0.05, 0.13, H/2, 0.13, woodD);
    B( W-0.05, H/2 + 0.06, -D+0.05, 0.13, H/2, 0.13, woodD);
    B(-W+0.05, H/2 + 0.06,  D-0.05, 0.13, H/2, 0.13, woodD);
    B( W-0.05, H/2 + 0.06,  D-0.05, 0.13, H/2, 0.13, woodD);
    B(0, H + 0.10, 0, W + 0.15, 0.06, D + 0.15, roof);
    B(0, H + 0.22, 0, W + 0.05, 0.06, D + 0.05, roof);
    B(0, H + 0.34, 0, W - 0.30, 0.06, D - 0.30, roof);
    B(0.45, H + 0.42, 0.35, 0.11, 0.14, 0.11, stoneD);
  }
  return k;
}

function drawExtras() {
  let k = 0;
  const cap = EXTRA_BOX_CAP * VERTS_PER_BOX * FLOATS_PER_VERT;
  const fits = boxes => k + boxes * VERTS_PER_BOX * FLOATS_PER_VERT <= cap;

  if (fits(7))                              k = appendCar(extraData, k, car);
  for (const e of enemies) if (fits(12))    k = appendEnemy(extraData, k, e);
  for (const s of structures) if (fits(30)) k = appendStructure(extraData, k, s);

  if (!k) return;
  gl.useProgram(mobProgram);
  pushLighting(mobProgram, mobU);
  gl.bindVertexArray(extraVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER, extraVBO);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, extraData, 0, k);
  gl.uniformMatrix4fv(mobU.u_projectionMatrix, false, projectionMatrix);
  gl.uniformMatrix4fv(mobU.u_modelViewMatrix,  false, modelViewMatrix);
  gl.uniform3f(mobU.u_cameraPosition, ...position);
  gl.uniform1f(mobU.u_fogDensity, FOG_DENSITY);
  gl.disable(gl.CULL_FACE);
  gl.drawArrays(gl.TRIANGLES, 0, k / FLOATS_PER_VERT);
  gl.enable(gl.CULL_FACE);
  gl.bindVertexArray(null);
  gl.useProgram(program);
}

function sendCarState(force) {
  const now = performance.now();
  if (!force && now - sendCarState._t < 60) return;
  sendCarState._t = now;
  const pkt = JSON.stringify({
    type: 'car',
    driver: car.driverId || '',
    x: +car.x.toFixed(2), y: +car.y.toFixed(2), z: +car.z.toFixed(2),
    yaw: +car.yaw.toFixed(3)
  });
  for (const pid in channels) {
    const ch = channels[pid];
    if (ch && ch.readyState === 'open') try { ch.send(pkt); } catch (e) {}
  }
}
sendCarState._t = 0;

function applyCarState(p) {
  car.driverId = p.driver || null;
  car.netX = p.x; car.netY = p.y; car.netZ = p.z; car.netYaw = p.yaw;
  if (!car.driving && !car.driverId) {
    car.x += (car.netX - car.x) * 0.4;
    car.y += (car.netY - car.y) * 0.4;
    car.z += (car.netZ - car.z) * 0.4;
    let d = car.netYaw - car.yaw;
    while (d >  Math.PI) d -= Math.PI*2;
    while (d < -Math.PI) d += Math.PI*2;
    car.yaw += d * 0.4;
  }
}

let lastEnemySend = 0;
function sendEnemyState() {
  if (!isMobHost || !survival.on) return;
  const now = performance.now();
  if (now - lastEnemySend < 100) return;
  lastEnemySend = now;
  if (!Object.keys(channels).length) return;
  const list = enemies.map(e => ({
    t: e.type,
    x: +e.x.toFixed(2), y: +e.y.toFixed(2), z: +e.z.toFixed(2),
    yaw: +e.yaw.toFixed(2), wp: +e.walkPhase.toFixed(2),
    fz: e.fuse, hp: e.hp, mx: e.maxHp
  }));
  const pkt = JSON.stringify({ type:'enemies', list });
  for (const pid in channels) {
    const ch = channels[pid];
    if (ch && ch.readyState === 'open') try { ch.send(pkt); } catch (e) {}
  }
}

function applyEnemyState(list) {
  if (isMobHost || !survival.on) return;
  while (enemies.length > list.length) {
    const e = enemies.pop(); removeHealthBar(e);
  }
  for (let i = 0; i < list.length; i++) {
    const inc = list[i];
    let e = enemies[i];
    if (!e) {
      e = { vx:0, vz:0, hp:100, maxHp:100, soundTimer:99, x:inc.x, y:inc.y, z:inc.z, yaw:inc.yaw, fuse:-1, healthBarT:0 };
      enemies[i] = e;
    }
    e.type = inc.t;
    e.netX = inc.x; e.netY = inc.y; e.netZ = inc.z;
    e.netYaw = inc.yaw; e.walkPhase = inc.wp;
    e.fuse = inc.fz;
    e.hp = inc.hp;
    e.maxHp = inc.mx;
    if (inc.hp < inc.mx) e.healthBarT = 3.0;
  }
}

const _handleChannelMessage = handleChannelMessage;
handleChannelMessage = function (peerID, raw) {
  let p = null;
  try { p = JSON.parse(raw); } catch (e) {}
  if (p && typeof p === 'object') {
    if (p.type === 'car')     { applyCarState(p); return; }
    if (p.type === 'enemies') { applyEnemyState(p.list); return; }
  }
  _handleChannelMessage(peerID, raw);
};

};

addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') {
    car.y = cachedHeightAt(car.x, car.z) + 0.5;
    car.netY = car.y;
    rebuildStructures(true);
  }
});

/* ══════════════════════════════════════════════════════════
   14 · MAIN LOOP WRAP
   ══════════════════════════════════════════════════════════ */
let _lastExtFrame = performance.now();
const _animate = animate;
animate = function () {
  const now = performance.now();
  const dt = Math.min((now - _lastExtFrame) / 1000, 0.05);
  _lastExtFrame = now;

  updateCar(dt);
  updateSurvival(dt);
  rebuildStructures(false);
  updateStructures(dt);

  /* Screen shake — offset the camera target slightly */
  if (shake.t > 0) {
    shake.t -= dt;
    const p = shake.t;
    const amp = shake.amp * p * p;
    targetPosition[0] += (Math.random() - 0.5) * amp;
    targetPosition[1] += (Math.random() - 0.5) * amp * 0.5;
    targetPosition[2] += (Math.random() - 0.5) * amp;
  }

  /* Gun recoil + muzzle flash + crosshair hit marker */
  updateGunVisual(dt);
  if (hitMarkerT > 0) {
    hitMarkerT -= dt;
    hitMarkerEl.style.opacity = Math.max(0, hitMarkerT / 0.12);
  } else if (hitMarkerEl.style.opacity !== '0') hitMarkerEl.style.opacity = '0';

  /* Health bars projected to screen */
  updateHealthBars();

  sendCarState(false);
  sendEnemyState();

  if ((animate._c = ((animate._c || 0) + 1) % 6) === 0) {
    updateSurvivalHud();
    if (car.driving) carPrompt.classList.remove('on');
    else {
      const dx = targetPosition[0] - car.x, dz = targetPosition[2] - car.z;
      const near = dx*dx + dz*dz < 36 && (!car.driverId || car.driverId === ID);
      carPrompt.classList.toggle('on', near);
    }
    updateCarBtn();
  }

  _animate();
};

updateSurvivalHud();
updateSurvivalBtn();
updateCarBtn();

/* time-of-day indicator */
const dnIndicator = document.createElement('div');
dnIndicator.id = 'timeofday';
dnIndicator.style.cssText = 'position:fixed;right:8px;top:44px;z-index:10;color:#ffd;font-size:12px;';
document.body.appendChild(dnIndicator);
setInterval(() => {
  const h = Math.floor(dayNight.time * 24);
  const m = Math.floor((dayNight.time * 24 - h) * 60);
  dnIndicator.textContent =
    (dayNight.isNight ? '🌙' : '☀️') + ' ' +
    String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
}, 500);

console.log('%c✔ HORROR UPDATE ACTIVE: countdown · lock · 500HP boss · red screen · health bars · gun anim · 100 zombies at night',
            'color:#f44;font-weight:bold;font-size:14px');
})();
</script>
